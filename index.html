<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>APEX Circuit — ระบบวางแผนและต้นทุน</title>
<link rel="icon" type="image/png" href="apex-logo.png" />
<meta name="robots" content="noindex, nofollow" />
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --hdr:#4f9de6; --strip:#bfdff6; --bg:#eef4fb;
  --blue:#1f6fc4; --green:#1e9e50; --amber:#d9a400; --red:#d93838; --purple:#7a4fd3;
  --orange:#c25f1e; --cyan:#0e8ca8; --teal:#12857a;
  --ink:#2b3a4a; --mut:#7d8ea0;
  --p-blue:#f1f8fe; --p-green:#f4fbf7; --p-red:#fdf4f4; --p-amber:#fdfaef; --p-purple:#f8f4fd; --p-cyan:#f0fafd;
  --line:#edf2f8; --line-d:#d7e2ee;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:"Sarabun","Segoe UI",Tahoma,"Thonburi",sans-serif;background:var(--bg);
     color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
#app{height:100vh;display:flex;flex-direction:column}

/* ─── แบรนด์ในเมนู ─── */
.brand{display:flex;align-items:center;gap:11px;padding:13px 12px 12px 14px;border-bottom:1px solid var(--line)}
.sidetog{margin-left:auto;width:28px;height:28px;border-radius:8px;flex:none;
  border:1px solid var(--line-d);background:#fff;color:#94a9bf;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:.16s;padding:0}
.sidetog:hover{background:var(--p-blue);border-color:#bcdcf7;color:var(--blue)}
.sidetog svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.brand .bl{width:38px;height:38px;flex:none}
.brand .bl svg,.brand .bl img{width:100%;height:100%;object-fit:contain}
.brand .bt b{display:block;font-size:15px;font-weight:700;color:var(--blue);line-height:1.25}
.brand .bt span{font-size:11.5px;color:var(--mut)}
.topstrip{background:var(--strip);color:#2b567c;font-size:12.5px;padding:5px 24px;flex:none;
  display:flex;align-items:center;gap:9px}
.topstrip .bc{display:flex;align-items:center;gap:7px}
.topstrip .bc b{font-weight:600}
.topstrip .sep{color:#7fa8cc}
.topstrip .rt{margin-left:auto;display:flex;gap:6px}
.tsb{border:none;background:rgba(255,255,255,.55);border-radius:7px;padding:3px 10px;font-family:inherit;
  font-size:11.5px;font-weight:600;color:#2b567c;cursor:pointer;display:flex;align-items:center;gap:5px;transition:.15s}
.tsb:hover{background:#fff}
.tsb svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ─── โครงหลัก ─── */
.body{flex:1;display:flex;min-height:0}
.side{width:308px;flex:none;background:#fff;border-right:1px solid var(--line-d);
  display:flex;flex-direction:column;z-index:20;box-shadow:1px 0 3px rgba(31,80,140,.04)}
.side{transition:width .22s cubic-bezier(.4,0,.2,1)}
.side.slim{width:64px}
.side.slim .bt,.side.slim .sfind,.side.slim .sfoot,.side.slim .items,
.side.slim .gt,.side.slim .gh .cnt,.side.slim .gh .car{display:none}
.side.slim .brand{flex-direction:column;justify-content:center;padding:13px 0 11px;gap:9px}
.side.slim .sidetog{margin:0}
.side.slim .sidetog svg{transform:rotate(180deg)}
.side.slim .brand .bl{width:32px;height:32px}
.side.slim .smenu{padding:10px 0 16px;overflow:visible}
.side.slim .grp{margin-bottom:6px;display:flex;justify-content:center}
.side.slim .gh{width:42px;height:42px;padding:0;border-radius:12px;justify-content:center;gap:0}
.side.slim .gh .gi{width:34px;height:34px;border-radius:10px;transition:box-shadow .16s}
.side.slim .gh .gi svg{width:17px;height:17px}
.side.slim .gh:hover{background:transparent}
.side.slim .gh:hover .gi{box-shadow:0 3px 9px -3px rgba(31,80,140,.55)}
.side.slim .gh.hasCur .gi{box-shadow:0 0 0 3px rgba(79,157,230,.3)}
.side.slim .gh.hasCur::after{content:'';position:absolute;left:0;width:3px;height:22px;
  border-radius:0 3px 3px 0;background:var(--hdr)}
.side.slim .gh{position:relative}

.sfind{padding:10px 12px 9px;border-bottom:1px solid var(--line)}
.sfind .w{position:relative}
.sfind input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line-d);border-radius:8px;
  font-family:inherit;font-size:14px;outline:none;background:#fbfdff}
.sfind input:focus{border-color:#7FB3E0;box-shadow:0 0 0 3px rgba(127,179,224,.16);background:#fff}
.sfind .si{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--mut);display:flex}
.slang{padding:9px 12px 8px;border-bottom:1px solid var(--line)}
.slang button{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;
  padding:8px 11px;border:1px solid var(--line-d);border-radius:8px;background:#fff;
  font-family:inherit;font-size:13px;font-weight:600;color:var(--blue);cursor:pointer;
  transition:border-color .15s,background .15s,box-shadow .15s}
.slang button:hover{background:var(--p-blue);border-color:#bcdcf7}
.slang button:active{transform:translateY(.5px)}
.slang svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;flex:none}
.side.slim .slang{padding:8px 0;display:flex;justify-content:center;border-bottom:none}
.side.slim .slang button{width:42px;height:42px;padding:0;border-radius:12px}
.side.slim .slang .lt{display:none}
.smenu{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 12px 16px;scrollbar-width:none;-ms-overflow-style:none}
.smenu::-webkit-scrollbar{width:0;height:0;display:none}
.grp{margin-bottom:12px}
.gh{width:100%;display:flex;align-items:center;gap:11px;padding:10px 12px;border:none;background:transparent;
  font-family:inherit;font-size:13.5px;font-weight:700;color:#5b7590;cursor:pointer;border-radius:9px;
  letter-spacing:.2px;transition:.15s}
.gh:hover{background:#f5f9fd}
.gh .gi{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none}
.gh .gi svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.gh .gt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gh .cnt{margin-left:auto;font-weight:600;color:#a8b6c4;font-size:12px}
.gh .car{width:15px;height:15px;stroke:#a8b6c4;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;
  transition:transform .18s;flex:none}
.grp.closed .car{transform:rotate(-90deg)}
.grp.closed .items{display:none}
.items{padding:4px 0 6px 8px}
.it{width:100%;display:flex;align-items:center;gap:11px;padding:10px 12px;border:none;background:transparent;
  margin-bottom:2px;
  font-family:inherit;font-size:14.5px;color:#3a5773;cursor:pointer;border-radius:8px;text-align:left;
  line-height:1.4;transition:.15s;position:relative}
.it:hover{background:#f5f9fd}
.it.on{background:var(--p-blue);color:var(--blue);font-weight:600}
.it.on::before{content:'';position:absolute;left:-6px;top:5px;bottom:5px;width:3px;border-radius:2px;background:var(--hdr)}
.it .dot{width:8px;height:8px;border-radius:2px;flex:none}
.it .tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .fr{flex:none;font-size:11.5px;color:#a8b6c4;font-weight:600;letter-spacing:.2px}
.it.soon{color:#b3c1cf;cursor:not-allowed}
.it.soon:hover{background:transparent}
.it.soon .dot{background:#dbe4ee!important}
.it .sn{font-size:9.5px;background:#f0f4f8;color:#93a3b3;border-radius:8px;padding:1px 6px;
  font-weight:700;margin-top:2px;flex:none}
/* ── submenu (Configuration) ── */
.subgrp{margin-top:6px}
.sh{width:100%;display:flex;align-items:center;gap:10px;padding:8px 12px;border:none;background:transparent;
  font-family:inherit;font-size:12px;font-weight:700;color:#7d92a8;cursor:pointer;border-radius:8px;
  letter-spacing:.5px;text-transform:uppercase;transition:.15s}
.sh:hover{background:#f5f9fd}
.sh .gi2{width:24px;height:24px;border-radius:7px;background:#eef3f9;display:flex;align-items:center;
  justify-content:center;flex:none}
.sh .gi2 svg{width:14px;height:14px;stroke:#5b7590;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sh .cnt{margin-left:auto;font-weight:600;color:#a8b6c4;font-size:11.5px}
.sh .car{width:14px;height:14px;stroke:#a8b6c4;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;
  transition:transform .18s;flex:none}
.subgrp.closed .car{transform:rotate(-90deg)}
.subgrp.closed .items{display:none}
.subgrp .items{margin-left:12px;padding:2px 0 2px 10px;border-left:2px solid var(--line)}
.sfoot{padding:9px 13px;border-top:1px solid var(--line);font-size:10.5px;color:var(--mut);line-height:1.5}

/* ─── พื้นที่แสดงผล ─── */
.main{flex:1;min-width:0;position:relative;background:var(--bg)}
iframe{width:100%;height:100%;border:none;display:block;background:#fff}
.home{position:absolute;inset:0;overflow:auto;padding:10px 34px 44px}
.home.hide{display:none}
.wel{text-align:center;padding:34px 20px 30px}
.wlogo{height:78px;width:auto;margin:0 auto 16px;display:block}
.wel h2{font-size:27px;font-weight:700;color:var(--blue);line-height:1.25}
.wel p{font-size:13.5px;color:#5b7590;margin-top:8px;line-height:1.85}
.hero{margin-bottom:22px}
.hero h2{font-size:25px;font-weight:700;color:var(--blue);line-height:1.25}
.hero p{font-size:13.5px;color:#4a6b86;margin-top:5px;max-width:820px;line-height:1.7}
.stat{display:flex;gap:0;border-top:1px solid var(--line-d);border-bottom:1px solid var(--line-d);
  margin:18px 0 24px;flex-wrap:wrap}
.stat .s{padding:12px 24px 12px 0;margin-right:24px;border-right:1px solid var(--line);flex:none}
.stat .s:last-child{border-right:none}
.stat .n{font-size:24px;font-weight:700;line-height:1.1}
.stat .t{font-size:12px;color:var(--mut);margin-top:2px}
.n-b{color:var(--blue)} .n-g{color:var(--green)} .n-c{color:var(--cyan)} .n-m{color:#a8b6c4}
/* แดชบอร์ดหน้าแรก */
.kbar{display:grid;grid-template-columns:repeat(6,1fr);gap:11px;margin:16px 0 22px}
.k{border:1px solid #e3ebf4;border-radius:12px;background:#fff;padding:13px 14px;cursor:pointer;
   text-align:left;font-family:inherit;position:relative;overflow:hidden;transition:.16s;
   box-shadow:0 1px 3px rgba(31,80,140,.05)}
.k:hover{transform:translateY(-2px);border-color:#bcdcf7;box-shadow:0 6px 16px -6px rgba(31,80,140,.3)}
.k::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.k .n{font-size:26px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.k .u{font-size:13px;font-weight:400;color:var(--mut);margin-left:2px}
.k .t{font-size:12px;font-weight:600;color:var(--ink);margin-top:5px;line-height:1.35}
.k .s{font-size:11px;color:var(--mut);margin-top:2px;line-height:1.45}
.k-red::before{background:var(--red)}      .k-red .n{color:var(--red)}
.k-amber::before{background:var(--amber)}  .k-amber .n{color:#a06a00}
.k-blue::before{background:var(--blue)}    .k-blue .n{color:var(--blue)}
.k-orange::before{background:var(--orange)}.k-orange .n{color:var(--orange)}
.k-green::before{background:var(--green)}  .k-green .n{color:var(--green)}
.k-purple::before{background:var(--purple)}.k-purple .n{color:var(--purple)}
.two{display:grid;grid-template-columns:1.45fr 1fr;gap:14px;margin-bottom:26px;align-items:start}
.pnl{border:1px solid #e3ebf4;border-radius:13px;background:#fff;overflow:hidden;
     box-shadow:0 1px 3px rgba(31,80,140,.05)}
.pnl .ph{padding:11px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;
  font-size:13px;font-weight:700;color:#3a5773;background:#fbfdff}
.pnl .ph small{margin-left:auto;font-weight:400;color:var(--mut);font-size:11.5px}
.todo{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line);
  cursor:pointer;transition:.14s;background:none;border-left:none;border-right:none;border-top:none;
  width:100%;font-family:inherit;text-align:left}
.todo:last-child{border-bottom:none}
.todo:hover{background:#f7fbff}
.todo .bd{width:9px;height:9px;border-radius:50%;flex:none}
.todo .tx{flex:1;min-width:0}
.todo .tx b{font-size:13px;font-weight:600;color:var(--ink);display:block}
.todo .tx span{font-size:11.5px;color:var(--mut)}
.todo .qt{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;flex:none}
.todo .go{width:20px;height:20px;flex:none;color:#c3d0dd}
.todo:hover .go{color:var(--blue)}
.todo .go svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.mini{padding:12px 16px 14px}
.mrow{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;padding:6px 0}
.mrow .v{font-weight:700;font-variant-numeric:tabular-nums}
.mtrk{height:7px;background:#eef3f8;border-radius:4px;overflow:hidden;margin:6px 0 12px;display:flex}
.mtrk i{display:block;height:100%}
.mlg{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-top:-6px;margin-bottom:12px}
.mlg span{display:flex;align-items:center;gap:5px}
.mlg i{width:8px;height:8px;border-radius:2px}
@media(max-width:1250px){.kbar{grid-template-columns:repeat(3,1fr)}.two{grid-template-columns:1fr}}
.sect{font-size:13.5px;font-weight:700;color:#3a5773;margin:0 0 12px;display:flex;align-items:center;gap:10px}
.sect small{font-weight:400;color:var(--mut);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:13px;margin-bottom:24px}
.c{background:#fff;border:1px solid #e3ebf4;border-radius:13px;overflow:hidden;cursor:pointer;
  text-align:left;font-family:inherit;transition:transform .16s,box-shadow .16s,border-color .16s;
  box-shadow:0 1px 3px rgba(31,80,140,.06)}
.c:hover{transform:translateY(-3px);border-color:#bcdcf7;box-shadow:0 6px 18px -6px rgba(31,80,140,.28)}
.c .ch{height:6px}
.c .cb{padding:13px 15px 14px}
.c .ci{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.c .ci svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.c h3{font-size:14.5px;font-weight:700;color:var(--ink);line-height:1.35}
.c .fr{font-size:10.5px;color:#a8b6c4;font-weight:600;margin-top:2px}
.c p{display:none}
.c .cf{display:none}
.tag{font-size:10.5px;font-weight:600;background:#f2f7fc;color:#5b7590;border-radius:8px;padding:2px 8px}
.c.soon{cursor:default;opacity:.62;background:#fbfcfe;border-style:dashed}
.c.soon:hover{transform:none;box-shadow:0 1px 3px rgba(31,80,140,.06);border-color:#e3ebf4}
.c.soon .ci{background:#dbe4ee!important}
footer{background:var(--hdr);color:#eaf4fd;text-align:center;font-size:13px;padding:12px;flex:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:64px;z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center}
.tst{background:#0f3f8c;color:#fff;border-radius:10px;padding:10px 18px;font-size:13px;
     box-shadow:0 8px 22px -6px rgba(15,40,80,.45);animation:pop .18s ease-out}
@keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}

/* ══ เก็บรายละเอียดความสวยงามทั้งโปรแกรม ══ */
::selection{background:#cfe6fa;color:#1a3a5c}
:focus-visible{outline:2px solid #7FB3E0;outline-offset:2px;border-radius:6px}
button,select,input,textarea{font-family:inherit}
button{-webkit-tap-highlight-color:transparent}
*::-webkit-scrollbar{width:9px;height:9px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:#d6e2ee;border-radius:6px;border:2px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:#bcd0e2;background-clip:content-box}
/* ปุ่มและช่องกรอกให้สูงเท่ากันและมุมนุ่มขึ้น */
.btn{border-radius:20px;transition:border-color .15s,box-shadow .15s,background .15s,color .15s}
.btn:active{transform:translateY(.5px)}
.sel,.inp{border-radius:8px;border-color:#dfe7f0;transition:border-color .15s,box-shadow .15s}
.sel:hover,.inp:hover{border-color:#c2d5e8}
.chip{letter-spacing:.1px}
/* ตัวเลขทุกที่ใช้ความกว้างเท่ากัน อ่านเป็นคอลัมน์ได้ */
td,th,input[type=number]{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="app">
  <div class="topstrip">
    <span class="bc" id="crumb"></span>
    <span class="rt">
      <button class="tsb" id="btnReload" onclick="reloadFrame()" style="display:none">
        <svg viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3 4v4h4"/></svg>โหลดใหม่</button>
      <button class="tsb" id="btnNew" onclick="openNew()" style="display:none">
        <svg viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M20 4l-8.5 8.5"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>แท็บใหม่</button>
      <button class="tsb" id="btnHome" onclick="goHome()" style="display:none">
        <svg viewBox="0 0 24 24"><path d="M3 10l9-6 9 6v10H3z"/><path d="M9 20v-7h6v7"/></svg>หน้าแรก</button>
    </span>
  </div>

  <div class="body">

let CUR=null, fq='', CLOSED=new Set();
function renderNav(){}
const navOf=f=>{const gr=GROUPS.find(x=>x.items.some(i=>i.f===f));return gr?gr.nav:null;};
function renderMenu(){
  const q=fq.toLowerCase();
  const itBtn=i=>i.f
    ? `<button class="it ${CUR===i.f?'on':''}" onclick="openScreen('${i.f}')" title="${i.n}">
         <span class="dot" style="background:${i.col}"></span>
         <span class="tx">${i.n}</span>
         ${i.fr!=='—'?`<span class="fr">${i.fr}</span>`:''}</button>`
    : `<span class="it soon"><span class="dot"></span>
         <span class="tx">${i.n}<span class="fr">${i.fr}</span></span>
         <span class="sn">รอทำ</span></span>`;
  g('smenu').innerHTML=GROUPS.map(gr=>{
    if(gr.menu===false) return '';
    const items=gr.items.filter(i=>!q||(i.n+' '+i.fr).toLowerCase().includes(q));
    if(!items.length) return '';
    const main=items.filter(i=>!i.sub), cfg=items.filter(i=>i.sub);
    const ck=gr.g+'/cfg';
    return `<div class="grp ${CLOSED.has(gr.g)&&!q?'closed':''}">
      <button class="gh ${gr.items.some(i=>i.f===CUR)?'hasCur':''}" onclick="togGrp('${gr.g}')" title="${gr.g}">
        <span class="gi" style="background:${gr.col}">${gr.ic}</span>
        <span class="gt">${gr.g}</span><span class="cnt">${items.length}</span>
        <svg class="car" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
      <div class="items">${main.map(itBtn).join('')}
        ${cfg.length?`<div class="subgrp ${CLOSED.has(ck)&&!q?'closed':''}">
          <button class="sh" onclick="togGrp('${ck}')" title="Configuration">
            <span class="gi2">${IC.gear}</span>
            <span class="gt">Configuration</span><span class="cnt">${cfg.length}</span>
            <svg class="car" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
          <div class="items">${cfg.map(itBtn).join('')}</div></div>`:''}
      </div></div>`;
  }).join('') || `<div style="padding:26px 14px;text-align:center;color:var(--mut);font-size:12.5px">ไม่พบเมนูที่ค้นหา</div>`;
  g('sfoot').innerHTML=`MRP รอบล่าสุด <b style="color:var(--blue)">03-08-2026 06:00</b><br>
    วัตถุดิบ 402 · สินค้า 24 · ข้อมูลจำลอง`;
}
function togGrp(k){
  if(g('side').classList.contains('slim')){toggleSide();CLOSED.delete(k);renderMenu();return;}
  CLOSED.has(k)?CLOSED.delete(k):CLOSED.add(k);renderMenu();}
g('q').addEventListener('input',e=>{fq=e.target.value.trim();renderMenu();});

/* เปิดหน้าจอตามคำขอจากหน้าลูก (ฟังก์ชันย่อยที่อยู่ในหน้าจอหลัก) */
window.addEventListener('message',function(e){
  var f=(e.data||{}).apexOpen;
  if(f && /^APEX_[A-Za-z_]+\.html$/.test(f)) openScreen(f);
});
function openScreen(f){
  const it=ALL.find(i=>i.f===f); if(!it) return;
  CUR=f;
  g('frame').src=f; g('frame').style.display='';
  g('home').classList.add('hide');
  ['btnReload','btnNew','btnHome'].forEach(b=>g(b).style.display='');
  crumb(it);
  renderMenu(); renderNav();
}
function goHome(){
  CUR=null; g('frame').style.display='none'; g('frame').src='about:blank';
  g('home').classList.remove('hide');
  ['btnReload','btnNew','btnHome'].forEach(b=>g(b).style.display='none');
  crumb(null); renderMenu(); renderNav();
}
function crumb(it){
  g('crumb').innerHTML = it
    ? `<b>APEX Circuit</b><span class="sep">›</span>${GROUPS.find(x=>x.items.includes(it)).g}
       <span class="sep">›</span><b>${it.n}</b>${it.fr!=='—'?`<span class="sep">·</span>${it.fr}`:''}`
