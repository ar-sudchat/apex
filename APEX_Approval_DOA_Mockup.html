<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="apex-logo.png" />
<meta name="robots" content="noindex, nofollow" />
<title>สายอนุมัติเอกสาร — APEX Circuit</title>
<link rel="icon" type="image/png" href="apex-logo.png" />
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --hdr:#4f9de6; --strip:#bfdff6; --bg:#eef4fb;
  --blue:#1f6fc4; --green:#1e9e50; --amber:#d9a400; --red:#d93838; --purple:#7a4fd3;
  --orange:#c25f1e; --cyan:#0e8ca8;
  --ink:#2b3a4a; --mut:#7d8ea0;
  --p-blue:#f1f8fe; --p-green:#f4fbf7; --p-red:#fdf4f4; --p-amber:#fdfaef; --p-purple:#f8f4fd; --p-cyan:#f0fafd;
  --th:#5b9fe0; --line:#edf2f8; --line-d:#d7e2ee;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:"Sarabun","Segoe UI",Tahoma,"Thonburi",sans-serif;background:var(--bg);
     color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
#app{min-height:100vh;display:flex;flex-direction:column}
header{background:var(--hdr);display:flex;align-items:stretch;height:76px;flex:none;position:sticky;top:0;z-index:100}
.logo-tab{background:#fff;border-radius:0 0 26px 0;width:212px;display:flex;align-items:center;justify-content:center;flex:none}
.apexlogo{height:44px;width:auto;display:block}
nav{display:flex;align-items:center;gap:4px;padding:0 10px;flex:1;min-width:0;overflow-x:auto}
nav::-webkit-scrollbar{display:none}
.mi{display:flex;flex-direction:column;align-items:center;gap:3px;color:#fff;font-size:12.5px;
    padding:8px 12px;border-radius:10px;white-space:nowrap;opacity:.94;cursor:pointer;transition:.2s;text-decoration:none}
.mi:hover{background:rgba(255,255,255,.12)}
.mi svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mi.active{background:rgba(255,255,255,.22);opacity:1;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.user{margin-left:auto;display:flex;align-items:center;gap:10px;color:#fff;padding-right:24px;flex:none}
.user svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:1.6}
.user b{font-size:14.5px;font-weight:600;display:block;line-height:1.3}
.user span{font-size:12px;opacity:.85}
.topstrip{background:var(--strip);color:#2b567c;font-size:12.5px;text-align:right;padding:5px 24px;flex:none}
.content{flex:1;padding:16px 20px 64px}
footer{background:var(--hdr);color:#eaf4fd;text-align:center;font-size:13px;padding:14px;flex:none}
.card{background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(31,80,140,.08);padding:16px 20px}
/* ไม่มีหัวข้อหน้าแล้ว เหลือแค่แถบปุ่มชิดขวา */
.page-head{display:flex;align-items:center;justify-content:flex-end;gap:20px;margin-bottom:14px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:7px 15px;border-radius:20px;
     border:1px solid #dfe7f0;background:#fff;font-family:inherit;font-size:13px;
     font-weight:500;color:var(--ink);cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{border-color:#9dbdd9;box-shadow:0 1px 4px rgba(31,80,140,.1)}
.btn:active{transform:translateY(.5px)}
.btn-p{background:var(--hdr);border-color:var(--hdr);color:#fff}
.btn-p:hover{background:#3d8ad6;border-color:#3d8ad6}
.btn-s{padding:5px 12px;font-size:12px}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sel,.inp{padding:7px 11px;border:1px solid #dfe7f0;border-radius:8px;background:#fff;
     font-family:inherit;font-size:13px;color:var(--ink);outline:none;transition:.15s}
.sel{padding-right:30px;cursor:pointer;appearance:none;
     background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3E%3Cpath d='M1 1.5l5 5 5-5' stroke='%237d8ea0' stroke-width='1.7' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");
     background-repeat:no-repeat;background-position:right 11px center;background-size:10px}
.sel:hover,.inp:hover{border-color:#c2d5e8}
.sel:focus,.inp:focus{border-color:#7FB3E0;box-shadow:0 0 0 3px rgba(127,179,224,.16)}

/* ── แถบสายอนุมัติ (stepper) ── */
.apvcard{margin-bottom:14px}
.apv-hd{display:flex;align-items:center;gap:11px;flex-wrap:wrap;padding-bottom:11px;border-bottom:1px solid var(--line)}
.apv-hd .no{font-size:16.5px;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums}
.apv-hd .sj{font-size:13px;color:#4a6b86}
.apv-hd .rt{margin-left:auto;font-size:12px;color:var(--mut)}
.stpwrap{overflow-x:auto;padding-bottom:2px}
.stp{display:flex;position:relative;min-width:720px;padding:14px 0 4px}
.stp-s{flex:1;position:relative;text-align:center;padding:48px 10px 0}
.stp-s .ln{position:absolute;top:22px;height:3px;background:var(--line-d);border-radius:2px}
.stp-s .ln.l{left:0;right:50%}
.stp-s .ln.r{left:50%;right:0}
.stp-s .ln.on{background:var(--green)}
.stp-mk{position:absolute;top:7px;left:50%;transform:translateX(-50%);width:33px;height:33px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;background:#fff;z-index:2;box-shadow:0 0 0 4px #fff}
.stp-mk svg{width:17px;height:17px;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.stp-s.done .stp-mk{background:var(--green)}
.stp-s.done .stp-mk svg{stroke:#fff}
.stp-s.cur .stp-mk{border:3px solid var(--green);background:#fff}
.stp-s.cur .stp-mk svg{stroke:var(--green)}
.stp-s.rej .stp-mk{background:var(--red)}
.stp-s.rej .stp-mk svg{stroke:#fff}
.stp-s.todo .stp-mk i{display:block;width:13px;height:13px;border-radius:50%;background:#cfd9e4}
.stp-t{font-size:12.8px;font-weight:700;color:var(--ink);line-height:1.45}
.stp-w{font-size:12.3px;color:#33546f;margin-top:4px;font-weight:600}
.stp-r{font-size:11px;color:var(--mut);margin-top:1px}
.stp-d{font-size:11.5px;color:var(--mut);margin-top:4px;font-variant-numeric:tabular-nums}
.stp-s.todo .stp-t{color:#aebccb;font-weight:600}
.stp-s.todo .stp-w{color:#bcc8d5;font-weight:500}
.stp-s.todo .stp-r{color:#c9d4de}
.stp-s.cur .stp-t{color:var(--green)}
.stp-act{display:flex;gap:7px;justify-content:center;margin-top:9px;flex-wrap:wrap}
.bt-ok{background:var(--green);border-color:var(--green);color:#fff}
.bt-ok:hover{background:#188945;border-color:#188945}
.bt-no{background:var(--red);border-color:var(--red);color:#fff}
.bt-no:hover{background:#c22f2f;border-color:#c22f2f}
.stp-why{font-size:11.5px;color:#b32b2b;background:var(--p-red);border:1px solid #f0c9c7;
  border-radius:7px;padding:6px 9px;margin-top:8px;line-height:1.55;text-align:left}
.stp-leg{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);
  border-top:1px solid var(--line);padding-top:9px;margin-top:4px}
.stp-leg i{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:5px}
.lg-done i{background:var(--green)}
.lg-cur i{background:#fff;border:2.5px solid var(--green)}
.lg-todo i{background:#cfd9e4}
.lg-rej i{background:var(--red)}

/* ── หัวเอกสาร : ช่องกรอกแบบโปรแกรมใบขอซื้อ (อ่านอย่างเดียว) ── */
.docform{border:1px solid var(--line-d);border-radius:10px;background:#fbfdff;
  padding:12px 14px 2px;margin-bottom:14px}
.docform .fbar{display:flex;align-items:center;gap:9px;padding:0 1px 10px;margin-bottom:11px;
  border-bottom:1px solid var(--line-d);font-size:12.5px;font-weight:700;color:#3a5773}
.docform .fbar .fb-s{font-weight:400;color:var(--mut);font-size:11.5px}
.frow{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:8px 14px;margin-bottom:8px}
/* ป้ายชื่ออยู่หน้าช่อง ชิดขวาเข้าหาช่อง — ป้ายที่ยาว (ฉบับอังกฤษ) ตัดลงบรรทัดที่สองได้ในความสูงเดิม */
.f{display:grid;grid-template-columns:106px minmax(0,1fr);align-items:center;gap:9px;min-width:0}
.f>label{font-size:11.5px;color:var(--mut);line-height:1.3;text-align:right}
.f .fi{display:block;min-height:34px;padding:7px 10px;
  border:1px solid var(--line-d);border-radius:7px;background:#fff;
  font-size:13px;font-weight:600;color:var(--ink);line-height:1.45;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f .fi .u{margin-left:4px}
.f .fi.soft{font-weight:500;color:#4a6b86}
.f .fi.mono{font-variant-numeric:tabular-nums}
.f .fi.rd{background:#f6fafd}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}
.c5{grid-column:span 5}.c6{grid-column:span 6}.c8{grid-column:span 8}
.c9{grid-column:span 9}.c12{grid-column:span 12}
@media(max-width:1080px){
  .c2,.c3,.c4{grid-column:span 6}.c5,.c6,.c8,.c9{grid-column:span 12}}
@media(max-width:640px){
  .frow>.f{grid-column:span 12;grid-template-columns:minmax(0,1fr);gap:4px}
  .f>label{text-align:left}}
.chip{display:inline-block;padding:2px 9px;border-radius:11px;font-size:10.5px;font-weight:700;white-space:nowrap}
.t-pr{background:var(--p-blue);color:var(--blue)}
.t-unl{background:#fdf3e3;color:#a5730a}
.t-cost{background:var(--p-green);color:#1a7a42}
.s-pend{background:var(--p-amber);color:#a06a00}
.s-done{background:var(--p-green);color:#1a7a42}
.s-rej{background:var(--p-red);color:#b32b2b}
.dtb{width:100%;border-collapse:collapse;font-size:12.5px}
.dtb th{background:#f3f7fc;color:#3a5773;font-weight:600;text-align:left;padding:8px 10px;
        border-bottom:1px solid var(--line-d);white-space:nowrap}
.dtb td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.dtb tr:hover td{background:#fafcfe}
.dtb .r{text-align:right;font-variant-numeric:tabular-nums}
.dtb .c{text-align:center}
.dtb tr.sum td{background:#f7fafd;font-weight:700}
/* แถวหัวกลุ่มสินค้าในตารางรายการ */
.dtb tr.grp td{background:#f2f7fc;color:#3a5773;font-weight:700;font-size:11.5px;
  padding:6px 10px;border-top:1px solid var(--line-d);border-bottom:1px solid var(--line-d)}
.dtb tr.grp:hover td{background:#f2f7fc}
.dtb tr.grp .cnt{font-weight:400;color:var(--mut);margin-left:9px}
.tblwrap{overflow-x:auto}
.dtb .why{white-space:normal;color:#b32b2b;line-height:1.55}
.code{font-weight:700;color:var(--blue)}
.sup{color:#4a6b86;font-size:12.5px}
.up{color:var(--red)} .dn{color:var(--green)}
.sect{font-size:12.5px;font-weight:700;color:#3a5773;margin:15px 0 8px;display:flex;align-items:center;gap:9px}
.sect:first-child{margin-top:0}
.sect small{font-weight:400;color:var(--mut);font-size:11.5px}
.fld{margin:12px 0}
.fld label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:5px}
.fld textarea{width:100%;min-height:64px;border:1px solid var(--line-d);border-radius:8px;padding:9px 11px;
  font-family:inherit;font-size:13px;color:var(--ink);resize:vertical;outline:none}
.fld textarea:focus{border-color:var(--hdr)}
.hint{background:#f5f9fd;border-left:3px solid var(--hdr);border-radius:0 7px 7px 0;padding:10px 14px;
      font-size:12.5px;color:#4a6b86;line-height:1.65;margin-top:12px}
.redbox{background:#fdf7f7;border:1px solid #f0c9c7;border-radius:9px;padding:11px 14px;
        font-size:12.5px;color:#b32b2b;line-height:1.65;margin-bottom:12px}
.okbox{background:var(--p-green);border:1px solid #c6e8d5;border-radius:9px;padding:11px 14px;
        font-size:12.5px;color:#1a7a42;line-height:1.65;margin-bottom:12px}
.demo{background:#fdf3e3;color:#a5730a;border:1px solid #f0d9a8;border-radius:20px;
  padding:5px 13px;font-size:12px;font-weight:600;white-space:nowrap}
.expl{background:#fbfdff;border:1px solid var(--line-d);border-left:3px solid var(--hdr);
  border-radius:0 9px 9px 0;padding:10px 14px;margin:0 0 14px;font-size:12.5px;line-height:1.75;color:#4a6b86}
.expl b{color:var(--ink);font-weight:600}
.lnk{color:var(--blue);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.u{font-style:normal;color:var(--mut);font-size:11.5px;font-weight:400}
.mono{font-variant-numeric:tabular-nums}

/* ── กล่อง ── */
.mask{position:fixed;inset:0;background:rgba(18,40,72,.4);z-index:200;display:flex;
      align-items:flex-start;justify-content:center;padding:44px 20px;overflow:auto}
.dlg{background:#fff;border-radius:10px;box-shadow:0 14px 44px rgba(15,40,80,.3);width:90%;max-width:1080px;overflow:hidden}
.dlg-hd{background:var(--th);color:#fff;padding:12px 18px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.dlg-hd h3{font-size:15px;font-weight:600;line-height:1.4}
.dlg-hd small{display:block;font-weight:400;opacity:.9;font-size:12px;margin-top:3px}
.dlg-x{background:transparent;border:none;color:#fff;font-size:21px;cursor:pointer;padding:1px 7px;border-radius:5px;font-family:inherit}
.dlg-x:hover{background:rgba(255,255,255,.24)}
.dlg-bd{padding:16px 18px;max-height:72vh;overflow:auto}
.dlg-ft{padding:10px 18px;border-top:1px solid var(--line);background:#fbfdff;display:flex;justify-content:space-between;align-items:center;gap:9px}
.toast{position:fixed;right:22px;bottom:22px;z-index:300;display:flex;flex-direction:column;gap:8px}
.tst{background:#0f3f8c;color:#fff;border-radius:9px;padding:11px 16px;font-size:13px;
     box-shadow:0 6px 20px rgba(15,40,80,.28);animation:sl .2s ease-out;max-width:450px;line-height:1.55}
.tst.ok{background:#1a7a42} .tst.warn{background:#a06a00} .tst.bad{background:#b32b2b}
@keyframes sl{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}
::selection{background:#cfe6fa;color:#1a3a5c}
*::-webkit-scrollbar{width:9px;height:9px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:#d6e2ee;border-radius:6px;border:2px solid transparent;background-clip:content-box}
td,th,input[type=number]{font-variant-numeric:tabular-nums}

/* ── ซ่อนหัวและท้ายอัตโนมัติเมื่อถูกเปิดในหน้ารวม ── */
html.embed header,html.embed footer,html.embed .topstrip{display:none!important}
html.embed .content{padding-top:14px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo-tab"><img class="apexlogo" src="apex-logo.png" alt="APEX Circuit" /></div>
    <nav>
      <a class="mi"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3.2-6.5 7-6.5s7 2.5 7 6.5"/><circle cx="18.5" cy="6" r="2.5"/></svg>Administrator</a>
      <a class="mi"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="5" rx="1"/><rect x="3" y="14" width="18" height="5" rx="1"/></svg>Master Data</a>
      <a class="mi"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="7" height="6" rx="1"/><rect x="14" y="8" width="7" height="6" rx="1"/><rect x="8" y="15" width="8" height="5" rx="1"/></svg>Items</a>
      <a class="mi"><svg viewBox="0 0 24 24"><path d="M4 19V9M9.5 19V5M15 19v-7M20.5 19v-4"/></svg>Sale</a>
      <a class="mi active"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4M8 13h3M8 17h6"/></svg>Planning</a>
      <a class="mi"><svg viewBox="0 0 24 24"><path d="M4 20V9l6-4 6 4v11"/><path d="M4 20h16"/><path d="M16 12h4v8"/><rect x="8" y="13" width="4" height="7"/></svg>Production</a>
      <a class="mi"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>Quality Control</a>
      <a class="mi"><svg viewBox="0 0 24 24"><path d="M3 10l9-6 9 6v10H3z"/><path d="M9 20v-7h6v7"/></svg>Warehouse</a>
      <a class="mi"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5h5M9.5 14.5h5"/></svg>Costing</a>
      <a class="mi"><svg viewBox="0 0 24 24"><path d="M3 7h5l2-3h9v5"/><rect x="3" y="7" width="18" height="13" rx="2"/></svg>Purchase</a>
    </nav>
    <div class="user">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
      <div><b>อาทิตย์ สุดชาติ</b><span>Production Planner</span></div>
    </div>
  </header>
  <div class="topstrip">Monday, August 3, 2026 (apex production)</div>

  <div class="content">
    <!-- แถบสายอนุมัติของเอกสารที่เลือก -->
    <div class="card apvcard" id="apvCard"></div>

    <div class="card">
      <div class="page-head">
        <div style="display:flex;gap:8px;align-items:center">
          <span class="demo">ตัวอย่างหน้าจอ · ข้อมูลจำลอง</span>
          <button class="btn" onclick="openDoaMatrix()">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9.5h18M9 9.5V20"/></svg>ผังอำนาจอนุมัติ</button>
          <button class="btn" onclick="openDoaReport()"><svg viewBox="0 0 24 24"><path d="M7 8V3.5h10V8"/><rect x="4" y="8" width="16" height="8.5" rx="1.5"/><path d="M7 14h10v6H7z"/></svg>พิมพ์รายงาน</button>
        </div>
      </div>

      <div id="detail"></div>
    </div>
  </div>
  <footer>Copyright © บริษัท จีเอเบิล จำกัด (G-Able Company Limited)</footer>
</div>
<div id="dlgRoot"></div><div class="toast" id="toast"></div>

<script>
const g=id=>document.getElementById(id);
const nf=(n,d=0)=>Number(n).toLocaleString('th-TH',{minimumFractionDigits:d,maximumFractionDigits:d});
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const TODAY=new Date(2026,7,3);          /* วันจันทร์ที่ 3 สิงหาคม 2026 — ตรึงไว้ทั้งระบบ */
const pD=s=>{const[d,m,y]=s.split('-').map(Number);return new Date(y,m-1,d);};
const ageOf=s=>Math.round((TODAY-pD(s))/86400000);
function toast(m,c=''){const d=document.createElement('div');d.className='tst '+c;d.innerHTML=m;
  g('toast').appendChild(d);setTimeout(()=>d.remove(),4200);}

/* ── ไปหน้าจออื่นในชุดเดียวกัน ── */
function goScreen(f){
  try{ if(window.self!==window.top && window.parent.openScreen){ window.parent.openScreen(f); return; } }catch(e){}
  window.open(f,'_blank');
}

/* ── นาฬิกาจำลอง : เดินหน้าครั้งละ 6 นาทีทุกครั้งที่มีการตัดสินใจ (ไม่ใช้เวลาจริง) ── */
let CLK=10*60+22;

function amtOf(d){ return (d.ty==='PR'||d.ty==='PO')? d.items.reduce((a,r)=>a+r.q*r.p,0) : 0; }
function pctOf(d){
  if(d.ty!=='COST') return 0;
  const o=d.items.reduce((a,r)=>a+r[2],0), n=d.items.reduce((a,r)=>a+r[3],0);
  return (n-o)/o*100;
}
function tierIdx(d){
  if(d.ty==='PR'||d.ty==='PO'){const v=amtOf(d);return v<=100000?0:v<=1000000?1:v<=5000000?2:3;}
  if(d.ty==='UNLOCK'){const n=d.items.length;return n<=2?0:n<=10?1:2;}
  const p=pctOf(d);return p<=2?0:p<=5?1:2;
}
/* ค่าที่ใช้เทียบกับผังอำนาจอนุมัติ */
function baseTxt(d){
  if(d.ty==='PR'||d.ty==='PO')   return nf(amtOf(d))+' <i class="u">บาท</i>';
  if(d.ty==='UNLOCK')return d.items.length+' <i class="u">รายการจอง</i>';
  return d.items.length+' <i class="u">รายการสินค้า</i> · '+(pctOf(d)>=0?'+':'')+pctOf(d).toFixed(1)+'%';
}
function baseRpt(d){
  if(d.ty==='PR'||d.ty==='PO')   return ApexReport.fmt(amtOf(d))+' THB';
  if(d.ty==='UNLOCK')return d.items.length+' รายการจอง';
  return d.items.length+' รายการสินค้า · '+(pctOf(d)>=0?'+':'')+pctOf(d).toFixed(1)+'%';
}

function prep(d){
  const T=TIER[d.ty][tierIdx(d)];
  d.tier=T;
  d.steps=FLOW[d.ty].map((s,i)=>({
    t: i===2 ? T.step : s.t,
    role: i===2 ? T.role : s.role,
    who: i===2 ? T.who : (s.who || d.req),
    ts: d.ts[i]||null, st:'todo', why:''
  }));
  d.steps.forEach((s,i)=>{
    if(i<d.cur) s.st='done';
    else if(i===d.cur) s.st = d.st==='rejected' ? 'rej' : (d.st==='done'?'done':'cur');
    else s.st='todo';
  });
  if(d.st==='rejected') d.steps[d.cur].why=d.why;
}

  if(d.st==='done') return 'ครบทุกขั้นแล้ว';
  if(d.st==='rejected') return 'หยุดที่ขั้นที่ '+(d.cur+1);
  return 'ขั้นที่ '+(d.cur+1)+' · '+d.steps[d.cur].t;
}

/* ── แถบสายอนุมัติ (stepper) ── */
function drawStepper(){
  const d=DOCS[SEL], S=d.steps, T=TYPE[d.ty];
  const body=S.map((s,i)=>{
    const lOn=i>0&&S[i-1].st==='done', rOn=s.st==='done';
    const mk=s.st==='done'?`<span class="stp-mk">${I_CHK}</span>`
            :s.st==='rej'?`<span class="stp-mk">${I_XX}</span>`
            :s.st==='cur'?`<span class="stp-mk">${I_CLK}</span>`
            :`<span class="stp-mk"><i></i></span>`;
    return `<div class="stp-s ${s.st}">
      ${i>0?`<span class="ln l ${lOn?'on':''}"></span>`:''}
      ${i<S.length-1?`<span class="ln r ${rOn?'on':''}"></span>`:''}
      ${mk}
      <div class="stp-t">${s.t}</div>
      <div class="stp-w">${s.who}</div>
      <div class="stp-r">${s.role}</div>
      ${s.ts?`<div class="stp-d">${s.ts}</div>`:''}
      ${s.st==='cur'&&d.st==='pending'?`<div class="stp-act">
        <button class="btn btn-s bt-ok" onclick="doApprove()"><svg viewBox="0 0 24 24"><path d="M5 12.6l4.6 4.6L19 6.8"/></svg>อนุมัติ</button>
        <button class="btn btn-s bt-no" onclick="doReject()"><svg viewBox="0 0 24 24"><path d="M6.8 6.8l10.4 10.4M17.2 6.8L6.8 17.2"/></svg>ไม่อนุมัติ</button></div>`:''}
      ${s.st==='rej'&&s.why?`<div class="stp-why">${esc(s.why)}</div>`:''}
    </div>`;}).join('');
  g('apvCard').innerHTML=`
    <div class="apv-hd"><span class="chip ${T.cls}">${T.n}</span>
      <span class="no">${d.no}</span><span class="sj">${d.subj}</span>
      <span class="chip ${ST[d.st].c}">${ST[d.st].t}</span>
      <span class="rt">${curStepTxt(d)}</span></div>
    <div class="stpwrap"><div class="stp">${body}</div></div>
    <div class="stp-leg">
      <span class="lg-done"><i></i>ผ่านแล้ว</span>
      <span class="lg-cur"><i></i>รอพิจารณาอยู่ตอนนี้</span>
      <span class="lg-todo"><i></i>ยังไม่ถึงคิว</span>
      <span class="lg-rej"><i></i>ไม่อนุมัติ</span>
      <span style="margin-left:auto">ผู้มีอำนาจในขั้นที่ 3 กำหนดตามผังอำนาจอนุมัติ</span>
    </div>`;
}

/* ── ตารางรายการของเอกสาร ── */
function itemTable(d){
  if(d.ty==='PR'||d.ty==='PO'){
    const tot=amtOf(d);
    /* จัดกลุ่มตามกลุ่มสินค้า เรียงกลุ่มตามลำดับที่พบครั้งแรกในเอกสาร */
    const G=[];
    d.items.forEach(r=>{ let g=G.find(x=>x.k===r.grp); if(!g){g={k:r.grp,rows:[]};G.push(g);} g.rows.push(r); });
    let seq=0;
    const body=G.map(g=>{
      const sub=g.rows.reduce((a,r)=>a+r.q*r.p,0);
      return `<tr class="grp"><td colspan="8">${g.k}<span class="cnt">${g.rows.length} รายการ</span></td>
          <td class="r">${nf(sub,2)}</td><td colspan="2"></td></tr>`
        + g.rows.map(r=>`<tr>
          <td class="c sup">${++seq}</td>
          <td><span class="code">${r.c}</span></td>
          <td class="sup">${r.n}</td>
          <td class="sup">${r.sp}</td>
          <td class="sup">${r.sup}</td>
          <td class="r">${nf(r.q,r.q<10?2:0)}</td>
          <td class="c sup">${r.u}</td>
          <td class="r">${nf(r.p,2)}</td>
          <td class="r">${nf(r.q*r.p,2)}</td>
          <td class="c mono">${r.need}</td>
          <td class="sup">${r.wh}</td></tr>`).join('');
    }).join('');
    return `<div class="tblwrap"><table class="dtb">
      <thead><tr><th class="c" style="width:40px">ลำดับ</th><th style="width:126px">รหัสวัตถุดิบ</th>
        <th style="width:250px">รายละเอียด</th><th style="width:172px">ขนาด / สเปก</th>
        <th style="width:132px">ผู้ขาย</th>
        <th class="r" style="width:84px">จำนวน</th><th class="c" style="width:52px">หน่วย</th>
        <th class="r" style="width:96px">ราคาต่อหน่วย</th><th class="r" style="width:108px">มูลค่า</th>
        <th class="c" style="width:106px">วันที่ต้องการรับ</th><th style="width:126px">คลังปลายทาง</th></tr></thead>
      <tbody>${body}
        <tr class="sum"><td colspan="8" class="r">รวมมูลค่าใบขอซื้อ</td><td class="r">${nf(tot,2)}</td>
          <td colspan="2"></td></tr>
      </tbody></table></div>`;
  }
  if(d.ty==='UNLOCK'){
    return `<table class="dtb">
      <thead><tr><th style="width:150px">ใบสั่งผลิต</th><th style="width:170px">วัตถุดิบ</th>
        <th class="r" style="width:120px">จำนวนที่จองไว้</th><th class="c" style="width:64px">หน่วย</th>
        <th class="c" style="width:130px">วันที่ต้องใช้</th></tr></thead>
      <tbody>${d.items.map(r=>`<tr><td><span class="code">${r[0]}</span></td><td class="sup">${r[1]}</td>
        <td class="r">${nf(r[3],r[3]<10?2:0)}</td><td class="c sup">${r[2]}</td>
        <td class="c mono">${r[4]}</td></tr>`).join('')}
        <tr class="sum"><td colspan="4" class="r">รวมรายการจองที่ขอปลดล็อก</td>
          <td class="c">${d.items.length}</td></tr>
      </tbody></table>`;
  }
  const o=d.items.reduce((a,r)=>a+r[2],0), n=d.items.reduce((a,r)=>a+r[3],0), p=pctOf(d);
  return `<table class="dtb">
    <thead><tr><th style="width:150px">รหัสสินค้า</th><th>ชื่อสินค้า</th>
      <th class="r" style="width:110px">ต้นทุนเดิม</th><th class="r" style="width:110px">ต้นทุนใหม่</th>
      <th class="r" style="width:100px">ส่วนต่าง</th><th class="r" style="width:100px">เปลี่ยนแปลง</th></tr></thead>
    <tbody>${d.items.map(r=>{const df=r[3]-r[2],pc=df/r[2]*100;
      return `<tr><td><span class="code">${r[0]}</span></td><td class="sup">${r[1]}</td>
      <td class="r">${nf(r[2],2)}</td><td class="r">${nf(r[3],2)}</td>
      <td class="r ${df>=0?'up':'dn'}">${df>=0?'+':''}${nf(df,2)}</td>
      <td class="r ${df>=0?'up':'dn'}">${pc>=0?'+':''}${pc.toFixed(1)}%</td></tr>`;}).join('')}
      <tr class="sum"><td colspan="2" class="r">รวมทุกรายการ</td>
        <td class="r">${nf(o,2)}</td><td class="r">${nf(n,2)}</td>
        <td class="r ${n>=o?'up':'dn'}">${n>=o?'+':''}${nf(n-o,2)}</td>
        <td class="r ${n>=o?'up':'dn'}">${p>=0?'+':''}${p.toFixed(1)}%</td></tr>
    </tbody></table>`;
}

/* ── รายละเอียดเอกสารที่เลือก ── */
function drawDetail(){
  const d=DOCS[SEL], T=TYPE[d.ty], age=ageOf(d.date);
  const box = d.st==='rejected'
    ? `<div class="redbox"><b>เอกสารใบนี้ไม่ได้รับอนุมัติ</b><br>${esc(d.why||'')}</div>`
    : d.st==='done'
    ? `<div class="okbox"><b>ผ่านครบทุกขั้นแล้ว</b> — เอกสารเปลี่ยนสถานะเป็นเสร็จสิ้น และดำเนินการปลายทางเรียบร้อย</div>`
    : '';
  g('detail').innerHTML=`
    <div class="sect">รายละเอียดเอกสาร <small>${T.full}</small>
      <span style="margin-left:auto"><span class="lnk" onclick="goScreen('${T.scr}')">${T.scrN}</span></span></div>
    ${box}
    <div class="docform">
      <div class="fbar">หัวเอกสาร<span class="fb-s">แสดงอย่างเดียว · แก้ไขได้ที่หน้าจอต้นทาง</span></div>
      <div class="frow">
        <div class="f c3"><label>เลขที่เอกสาร</label><div class="fi rd"><span class="code">${d.no}</span></div></div>
        <div class="f c3"><label>ชนิดเอกสาร</label><div class="fi rd"><span class="chip ${T.cls}">${T.n}</span></div></div>
        <div class="f c3"><label>วันที่ขอ</label><div class="fi rd mono">${d.date}</div></div>
        <div class="f c3"><label>สถานะ</label><div class="fi rd"><span class="chip ${ST[d.st].c}">${ST[d.st].t}</span></div></div>
      </div>
      <div class="frow">
        <div class="f c3"><label>ผู้ขอ</label><div class="fi">${d.req}</div></div>
        <div class="f c3"><label>แผนกผู้ขอ</label><div class="fi">${d.dept}</div></div>
        <div class="f c3"><label>มูลค่า / จำนวน</label><div class="fi mono">${baseTxt(d)}</div></div>
        <div class="f c3"><label>อายุคำขอ</label><div class="fi">${d.st==='pending'?age+' <i class="u">วัน</i>':'<i class="u">ปิดแล้ว</i>'}</div></div>
      </div>
      <div class="frow">
        <div class="f c12"><label>เรื่อง</label><div class="fi soft">${d.subj}</div></div>
      </div>
    </div>
    <div class="sect">รายการในเอกสาร <small>${d.items.length} บรรทัด</small></div>
    ${itemTable(d)}`;
}

function draw(){ drawStepper(); drawDetail(); }

/* ═════════ การตัดสินใจ ═════════ */
function doApprove(){
  const d=DOCS[SEL];
  if(d.st!=='pending'){ toast('เอกสารใบนี้ปิดเรื่องแล้ว ไม่สามารถตัดสินใจซ้ำได้','warn'); return; }
  const s=d.steps[d.cur];
  s.st='done'; s.ts=stamp();
  d.cur++;
  if(d.cur>=d.steps.length){
    d.st='done';
    toast('อนุมัติครบทุกขั้นแล้ว · เอกสารเปลี่ยนสถานะเป็นเสร็จสิ้น','ok');
  }else{
    d.steps[d.cur].st='cur';
    toast('บันทึกการอนุมัติแล้ว · ส่งต่อไปยังขั้นถัดไป','ok');
  }
  draw();
}
/* กดไม่อนุมัติ → เปิดกล่องให้ระบุเหตุผลก่อน ไม่กรอกจะบันทึกไม่ได้ */
function doReject(){
  const d=DOCS[SEL];
  if(d.st!=='pending'){ toast('เอกสารใบนี้ปิดเรื่องแล้ว ไม่สามารถตัดสินใจซ้ำได้','warn'); return; }
  g('dlgRoot').innerHTML=`
  <div class="mask" onclick="if(event.target===this)closeDlg()"><div class="dlg" style="max-width:560px">
    <div class="dlg-hd"><h3>ระบุเหตุผลที่ไม่อนุมัติ
      <small>${d.no} · ${d.subj}</small></h3>
      <button class="dlg-x" onclick="closeDlg()">×</button></div>
    <div class="dlg-bd">
      <div class="fld" style="margin:0"><label>เหตุผล / หมายเหตุประกอบการตัดสินใจ</label>
        <textarea id="rsn" placeholder="กรอกเหตุผล — บังคับกรอกเมื่อกดไม่อนุมัติ"></textarea></div>
      <div class="hint">เหตุผลนี้จะถูกเก็บไว้ในประวัติของเอกสารและแสดงในรายงาน เพื่อให้ตรวจสอบย้อนกลับได้</div>
    </div>
    <div class="dlg-ft"><span style="font-size:12.5px;color:var(--mut)">ขั้นที่ ${d.cur+1} · ${d.steps[d.cur].t}</span>
      <span style="display:flex;gap:8px"><button class="btn" onclick="closeDlg()">ยกเลิก</button>
        <button class="btn bt-no" onclick="confirmReject()">ยืนยันไม่อนุมัติ</button></span></div>
  </div></div>`;
  const t=g('rsn'); if(t) t.focus();
}
function confirmReject(){
  const d=DOCS[SEL], box=g('rsn'), why=(box&&box.value||'').trim();
  if(!why){
    toast('กรุณากรอกเหตุผลก่อนกดไม่อนุมัติ','warn');
    if(box){ box.style.borderColor='var(--red)'; box.focus(); }
    return;
  }
  const s=d.steps[d.cur];
  s.st='rej'; s.ts=stamp(); s.why=why;
  d.st='rejected'; d.why=why;
  closeDlg();
  draw();
  toast('บันทึกการไม่อนุมัติแล้ว · เอกสารถูกตีกลับพร้อมเหตุผล','bad');
}

        ผู้มีอำนาจในขั้นที่ 3 จะยกระดับขึ้นเองตามมูลค่าหรือผลกระทบของเอกสาร ไม่ต้องตั้งค่าใหม่รายใบ</div>

          <th style="width:130px">ผู้ถือสิทธิ์ปัจจุบัน</th><th>ชื่อขั้นในสายอนุมัติ</th></tr></thead>
        <tbody>${rows}</tbody></table>
      <div class="sect">เอกสารในระบบตอนนี้เข้าเกณฑ์ระดับใดบ้าง</div>
      <table class="dtb">
        <thead><tr><th style="width:150px">เลขที่เอกสาร</th><th style="width:140px">ประเภท</th>
          <th class="r" style="width:190px">มูลค่า / จำนวน</th><th style="width:190px">ระดับอำนาจอนุมัติ</th>
          <th>ผู้อนุมัติในขั้นที่ 3</th></tr></thead>
        <tbody>${DOCS.map(d=>`<tr><td><span class="code">${d.no}</span></td>
          <td><span class="chip ${TYPE[d.ty].cls}">${TYPE[d.ty].n}</span></td>
          <td class="r">${baseTxt(d)}</td><td><b style="color:var(--blue)">${d.tier.role}</b></td>
          <td class="sup">${d.tier.who}</td></tr>`).join('')}</tbody></table>
      <div class="hint">ถ้าผู้มีอำนาจไม่อยู่ ระบบให้ตั้งผู้รักษาการแทนได้ตามช่วงเวลา โดยประวัติจะบันทึกชื่อผู้ทำจริงเสมอ
        เพื่อให้ตรวจสอบย้อนกลับได้ว่าใครเป็นคนอนุมัติ</div>
    </div>
    <div class="dlg-ft"><span style="font-size:12.5px;color:var(--mut)">

draw();
</script>
<script>

<script>

  const F=ApexReport.fmt;

                  (i+1)+'. '+s.t, s.who, res, when ]);

  });
  const pend=DOCS.filter(d=>d.st==='pending').length;
  const done=DOCS.filter(d=>d.st==='done').length;
  const rej =DOCS.filter(d=>d.st==='rejected').length;

  ApexReport.open({

    meta2:[['จำนวนเอกสาร',DOCS.length+' รายการ'],['ประเภทเอกสาร','3 ประเภท'],
           ['จำนวนขั้นอนุมัติ','4 ขั้นต่อเอกสาร'],['ผังอำนาจอนุมัติ','DOA-MATRIX-2026']],
