<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="gable-mark.png" />
<meta name="robots" content="noindex, nofollow" />
<title>APEX Planning &amp; Costing System — Presentation</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --org:#FF8006; --org-d:#D96A00; --org-l:#FFF4E8;
  --ink:#414041; --mut:#6B6F74; --grey:#919091; --line:#DFE2E6; --line-d:#C6CBD1;
  --bg:#F3F3F3; --bg2:#F8F8F8; --blue:#1F6FC4; --blue-l:#F1F8FE;
  --green:#00B28F; --teal:#245477; --sky:#0A96E8; --red:#A32311; --navy:#232A40;
  --sw:1600px;                    /* ความกว้างสไลด์ 20" @80dpi */
  --sh:900px;                     /* 11.25" */
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:"Sarabun","G-Able",Arial,Helvetica,sans-serif;background:#E9EBEE;color:var(--ink);
  font-size:15px;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}

/* ─────────── control bar ─────────── */
header{flex:0 0 auto;background:#fff;border-bottom:1px solid var(--line);padding:0 16px;height:56px;
  display:flex;align-items:center;gap:12px;z-index:30;box-shadow:0 1px 10px rgba(0,0,0,.06)}
header .brand{display:flex;align-items:center;gap:10px}
header .brand img{height:26px}
header .sub{font-size:12.5px;color:var(--mut);border-left:1px solid var(--line);padding-left:12px}
header .spacer{flex:1}
header button{background:#fff;color:var(--ink);border:1px solid var(--line-d);border-radius:9px;
  height:34px;min-width:36px;padding:0 12px;font-family:inherit;font-size:14px;cursor:pointer;transition:.15s}
header button:hover{background:var(--bg2);border-color:var(--org)}
header button.on{background:var(--org);border-color:var(--org);color:#fff;font-weight:700}
.count{font-size:14px;color:var(--mut);min-width:62px;text-align:center;font-variant-numeric:tabular-nums}
#zoom,#lang{display:flex;gap:4px}#zoom button,#lang button{font-size:12.5px;padding:0 10px}
#lang{margin-right:4px}

/* ─────────── layout ─────────── */
.body{flex:1;display:flex;min-height:0;position:relative}
.edge{position:absolute;left:0;top:0;bottom:0;width:16px;z-index:18;cursor:pointer}
.edge::after{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:4px;height:76px;border-radius:0 5px 5px 0;background:var(--org);opacity:.45}
.edge:hover::after{opacity:1}
.scrim{position:absolute;inset:0;background:rgba(35,42,64,.18);z-index:19;opacity:0;
  pointer-events:none;transition:opacity .22s}
.scrim.on{opacity:1;pointer-events:auto}
body.pinned .scrim{display:none}
nav{background:#fff;border-right:1px solid var(--line);overflow-y:auto;padding:0 0 16px;
  position:absolute;left:0;top:0;bottom:0;width:300px;z-index:20;
  transform:translateX(-100%);transition:transform .22s cubic-bezier(.4,0,.2,1);
  box-shadow:4px 0 22px rgba(0,0,0,.1)}
nav.on,body.pinned nav{transform:translateX(0)}
body.pinned .body{padding-left:300px}
nav .head{display:flex;align-items:center;gap:8px;padding:13px 14px 11px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:#fff;z-index:2}
nav .head .t{font-weight:800;font-size:13px;letter-spacing:.08em;color:var(--ink);flex:1}
nav .head button{background:#fff;border:1px solid var(--line-d);border-radius:8px;height:29px;
  min-width:31px;cursor:pointer;font-size:12.5px}
nav .head button.on{background:var(--org-l);border-color:var(--org)}
nav a{display:flex;gap:10px;align-items:flex-start;padding:9px 14px;text-decoration:none;
  color:var(--ink);border-left:3px solid transparent;transition:.12s}
nav a:hover{background:var(--bg2)}
nav a.on{background:var(--org-l);border-left-color:var(--org)}
nav a .idx{flex:0 0 25px;height:25px;border-radius:7px;background:var(--bg);color:var(--mut);
  font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
nav a.on .idx{background:var(--org);color:#fff}
nav a .nm{display:block;font-size:13.5px;font-weight:600;line-height:1.3}
nav a .cd{display:block;font-size:11px;color:var(--grey);margin-top:2px;letter-spacing:.03em}
nav a .bd{display:inline-block;font-size:9.5px;font-weight:700;border-radius:5px;padding:1px 6px;
  margin-left:6px;background:#E6F7F3;color:#00785F}

/* ─────────── G-Able slide frame ───────────
   ถอดพิกัดจริงจาก APEX_Presentation_TH RV01.2.pptx (สไลด์ 20" × 11.25" → 80px/นิ้ว)
   · หน้าเนื้อหา  = layout "Light theme_Page"  พื้นขาว · โลโก้เทาขวาบน · แถบล่างเต็มความกว้าง
   · หน้าปก/คั่น  = layout "Title Slide"       พื้น #414042 · โลโก้ขาวซ้ายบน · ตัว g ยักษ์ขวา   */
.stage{flex:1;overflow:auto;padding:20px;display:flex;justify-content:center;align-items:flex-start}
.sheet{width:var(--sw);height:var(--sh);background:#fff;flex:none;position:relative;overflow:hidden;
  box-shadow:0 10px 40px rgba(0,0,0,.16);transform-origin:top center;
  display:flex;flex-direction:column}

/* ── หน้าเนื้อหา (Light theme_Page) ── */
.gh{position:absolute;right:43px;top:39px;z-index:2}      /* โลโก้ x=17.77" y=0.49" w=1.69" */
.gh img{width:135px;display:block}
.gf{position:absolute;left:0;right:0;bottom:0;height:36px;z-index:2}  /* แถบล่าง y=10.855" h=0.445" */
.gf img{width:100%;height:100%;object-fit:fill;display:block}
.gf .cf{position:absolute;left:1192px;top:0;bottom:0;display:flex;align-items:center;
  font-size:12.5px;color:#fff;letter-spacing:.01em}
.gf .pg{position:absolute;left:59px;top:0;bottom:0;display:flex;align-items:center;
  font-size:12.5px;color:#fff;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.04em}
/* เนื้อหาทุกหน้าเป็น flex column และให้บล็อกหลักยืดเต็มความสูง
   เพราะนำเสนอแบบ Fit page — ที่ว่างด้านล่างคือตัวหนังสือที่เล็กลงเปล่า ๆ */
.gb{flex:1;min-height:0;padding:44px 59px 50px 59px;overflow:hidden;
  display:flex;flex-direction:column}
.gb>*{flex:0 0 auto}
.gb>.grid,.gb>table.tb,.gb>.tl,.gb>.fill,.gb>.demo-wrap{flex:1 1 auto;min-height:0}
/* Server spec — ตารางมีไม่กี่แถว ถ้ายืดเต็มความสูงแถวจะสูงผิดสัดส่วนและหัวตารางบวม
   จึงให้ตารางสูงตามเนื้อหา แล้วจัดทั้งบล็อกกึ่งกลางแนวตั้งแทน */
.srv>div{display:flex;flex-direction:column;min-height:0}
.srv>div>table.tb{flex:0 0 auto}
.grid.srv{grid-auto-rows:auto;align-content:center;gap:16px 34px}
.srv table.tb{font-size:22px}
.srv table.tb th{font-size:16px;padding:18px 20px}
.srv table.tb td{padding:22px 20px}
.srv>div>h4{font-size:18px!important}

h2.tt{font-size:46px;font-weight:800;letter-spacing:.01em;line-height:1.08;color:var(--ink);
  text-transform:uppercase}
h2.tt em{font-style:normal;color:var(--org)}
.rule{width:104px;height:6px;background:var(--org);margin:14px 0 16px}
p.lead{font-size:19.5px;color:var(--mut);line-height:1.5;max-width:1300px;margin-bottom:20px}

/* blocks */
.grid{display:grid;gap:16px;grid-auto-rows:1fr;align-content:stretch}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px 22px;
  border-top:4px solid var(--c,var(--org));min-height:0}
.card h4{font-size:21px;font-weight:800;color:var(--c,var(--ink));line-height:1.22;text-transform:uppercase}
.card p{font-size:16.5px;color:var(--mut);margin-top:8px;line-height:1.55}
.card ul{margin:10px 0 0 19px;font-size:16px;line-height:1.65}
/* Project delivery — เอากล่อง "ไม่รวมในขอบเขต" ออกแล้ว การ์ดจึงสูงเต็มหน้า
   ขยายตัวหนังสือทั้งชุดให้อ่านออกจากท้ายห้อง และเปลี่ยนหัวข้อย่อยเป็นจุดสีประจำก้อน */
.grid.scp .card{padding:26px 24px 24px;border-radius:14px}
.grid.scp .card h4{font-size:29px}
.grid.scp .card .chip{font-size:13.5px;padding:5px 14px;margin-top:12px}
.grid.scp .card ul{margin:24px 0 0;padding:0;list-style:none;font-size:24px;line-height:1.5}
.grid.scp .card li{position:relative;padding-left:29px;margin-bottom:20px}
.grid.scp .card li:last-child{margin-bottom:0}
.grid.scp .card li::before{content:'';position:absolute;left:2px;top:.6em;width:9px;height:9px;
  border-radius:50%;background:var(--c)}
/* Pre-requisite — รายการสั้นแต่การ์ดสูงเต็มหน้า ขยายตัวหนังสือให้อ่านออกจากท้ายห้อง
   21px คือขนาดใหญ่สุดที่บรรทัดยาวสุด (Inventory stock with lots and expiry dates) ยังไม่ตกบรรทัด */
.card.prqc{padding:24px 26px}
.card.prqc h4{font-size:25px}
.card.prqc ul{margin:16px 0 0 22px;font-size:21px;line-height:1.6}
.card.prqc li{margin-bottom:16px}
.card.prqc li:last-child{margin-bottom:0}
/* เหลือกลุ่มเดียว (Master Data) — การ์ดกินเต็มหน้า แตกรายการเป็นสองคอลัมน์
   แต่ละข้อเป็นแถบพื้นอ่อนเต็มช่อง ที่ว่างจึงเป็นจังหวะของหน้า ไม่ใช่ช่องโหว่
   28px คือขนาดใหญ่สุดที่บรรทัดยาวสุด (Routing and standard time per process) ยังไม่ตกบรรทัด */
.card.prqc.solo{padding:30px 34px;display:flex;flex-direction:column}
.card.prqc.solo h4{font-size:30px}
.card.prqc.solo ul{flex:1;min-height:0;margin:18px 0 0;padding:0;list-style:none;
  display:grid;grid-auto-flow:column;column-gap:54px;row-gap:0}
.card.prqc.solo li{margin:0;display:flex;align-items:center;gap:22px;padding:0 6px;
  border-top:1px solid var(--line);font-size:30px;line-height:1.3}
.card.prqc.solo li.lr{border-bottom:1px solid var(--line)}   /* ปิดเส้นท้ายคอลัมน์ */
.card.prqc.solo li::before{content:'';flex:0 0 28px;height:28px;background:#fff;
  border:3px solid var(--c);border-radius:6px}
.qa{background:var(--bg);border-radius:12px;padding:34px 38px 30px;border-left:7px solid var(--org);
  display:flex;flex-direction:column;position:relative;overflow:hidden}
/* ลายน้ำ ? — ใช้แพตเทิร์นเดียวกับเลขจางบนสไลด์ Workflow (.fw .st .no)
   วางคุมมุมขวาล่าง ให้ที่ว่างใต้ข้อความกลายเป็นพื้นที่หายใจ ไม่ใช่ช่องโหว่ */
.qa::after{content:'?';position:absolute;right:30px;bottom:-118px;font-size:350px;font-weight:800;
  line-height:1;color:var(--org);opacity:.10;pointer-events:none}
.qa .tm{font-size:15px;letter-spacing:.14em;font-weight:800;color:var(--org)}
.qa .qb{position:relative;z-index:1}
.qa .q{font-size:35px;font-weight:700;line-height:1.24;margin-top:16px}
.qa .a{font-size:21px;color:var(--mut);margin-top:13px;line-height:1.45}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-top:18px}
.stat{background:var(--ink);color:#fff;border-radius:10px;padding:15px 19px}
.stat .v{font-size:35px;font-weight:800;color:var(--org);line-height:1.1}
.stat .l{font-size:15px;opacity:.88;margin-top:5px;line-height:1.35}
.note{margin-top:16px;background:var(--org-l);border-left:5px solid var(--org);border-radius:8px;
  padding:15px 20px;font-size:16px;line-height:1.55}
.note b{color:var(--org-d)}
table.tb{width:100%;border-collapse:collapse;font-size:16px}
table.tb th{background:var(--ink);color:#fff;text-align:left;padding:12px 15px;font-weight:700;
  font-size:14px;letter-spacing:.05em;text-transform:uppercase}
table.tb td{padding:11px 15px;border-bottom:1px solid var(--line);vertical-align:middle;line-height:1.45}
table.tb tr:nth-child(even) td{background:var(--bg2)}
/* Technology stack — 8 แถวยืดเต็มความสูง แถวสูง ~80px แต่ตัวหนังสือเดิมสูงแค่ 23px
   ขยายเป็น 21px แล้วบีบคอลัมน์ซ้ายจาก 22% เหลือ 19% เพื่อให้แถว Database
   ('Microsoft SQL Server Standard or higher · …') ยังจบในบรรทัดเดียว          */
table.tb.tech{font-size:21px}
table.tb.tech th{font-size:17px;padding:15px 18px}
table.tb.tech td{padding:14px 18px}
/* 4 คำถามสำคัญ — มีแค่ 4 แถวยืดเต็มความสูง แถวสูง 148px ต่อข้อความบรรทัดเดียว
   ขยายคำถามได้ถึง 28px เพราะข้อ EN ที่ยาวที่สุด ('WHAT SHOULD WE DO IF RAW
   MATERIAL PRICES CHANGE?') เริ่มตัดสองบรรทัดที่ 30px บนคอลัมน์ 54% (800px)   */
table.tb.four th{font-size:17px;padding:15px 18px}
table.tb.four td{padding:14px 18px}
table.tb.four td.q{font-weight:700;font-size:28px;line-height:1.3}
table.tb.four .chip{font-size:22px;padding:8px 20px;border-radius:20px}
.chip{display:inline-block;font-size:11.5px;font-weight:700;border-radius:14px;padding:3px 10px;
  background:var(--org-l);color:var(--org-d)}
.chip.b{background:var(--blue-l);color:var(--blue)}

/* live demo — จอเต็มความกว้าง, คำอธิบายเป็นแถบล่าง */
.demo-wrap{flex:1;min-height:0;display:flex;flex-direction:column;gap:11px}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;
  border:1px solid var(--line-d);border-radius:10px;overflow:hidden;background:#fff;position:relative}
.screen .bar{flex:0 0 auto;background:var(--ink);color:#fff;padding:7px 13px;display:flex;align-items:center;gap:9px;font-size:12.5px}
.screen .bar .dots{display:flex;gap:5px}
.screen .bar .dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.28)}
.screen .bar .url{flex:1;background:rgba(255,255,255,.1);border-radius:6px;padding:3px 9px;font-size:11.5px;
  opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.screen .bar a{color:#fff;background:var(--org);border-radius:7px;padding:4px 11px;font-size:12px;
  font-weight:700;text-decoration:none}
.screen .bar a:hover{background:var(--org-d)}
/* ซูมหน้าจอในกรอบให้ตัวหนังสือใหญ่ขึ้น — render แคบลงแล้วขยายกลับเต็ม 1480
   ความกว้างขั้นต่ำที่ไม่มีคอลัมน์ถูกตัดคือ 1380 (Stock at Risk) หน้าอื่นลงได้ถึง 1200 */
.frame{position:relative;background:var(--bg);flex:1;min-height:0;overflow:hidden}
.frame>iframe{width:1220px;height:1400px;border:0;display:block;
  transform:scale(1.2131);transform-origin:top left}
/* หน้ากากก่อนกด Play — บอกที่มาของหน้าจอและประโยชน์ที่ได้ ก่อนเข้าโปรแกรมจริง
   โทนสว่างเข้าชุดกับสไลด์ · ประโยคหลักตัวใหญ่อ่านออกจากท้ายห้อง
   · การ์ดประโยชน์ยืดเต็มความสูงกรอบ ไม่เหลือที่ว่างกลางจอ */
.frame .veil{position:absolute;inset:0;cursor:pointer;z-index:3;
  background:linear-gradient(148deg,#FFFFFF 0%,#F5F8FB 58%,#EDF2F7 100%);
  color:var(--ink);display:flex;flex-direction:column;padding:30px 38px 28px}
.frame.live .veil{display:none}
/* คอลัมน์ซ้ายกว้างขึ้นจากเดิม 31% — แผงนี้เป็นภาพหน้าจอแล้ว ไม่ใช่ย่อหน้า ยิ่งกว้างยิ่งดูออก */
.veil .vin{flex:1;min-height:0;display:grid;grid-template-columns:41% 1fr;gap:30px}
/* --vhh = ความสูงบรรทัดหัวข้อคอลัมน์ ตรึงไว้เป็นตัวเลขเดียว เพราะคอลัมน์ซ้ายไม่มีหัวข้อแล้ว
   แต่ต้องกันที่สูงเท่ากันไว้ ยอดแผงภาพจึงจะตรงกับการ์ดใบแรกฝั่งขวาพอดี */
.veil{--vhh:17px}
.veil .vh{display:block;font-size:12.5px;line-height:var(--vhh);font-weight:800;letter-spacing:.16em;color:var(--org-d)}
.veil .vl,.veil .vr{display:flex;flex-direction:column;min-height:0}
.veil .vl{padding-top:var(--vhh)}
/* คอลัมน์ซ้าย — เหตุผลของหน้าจอ วางเป็นแผงเต็มความสูงให้เท่ากับการ์ดฝั่งขวา
   เดิมย่อหน้าถูก margin-top:auto ดันลงไปติดปุ่มล่าง (เพราะถอดบรรทัดสรุปเล็ก p.sm ออกแล้ว)
   หัวข้อจึงลอยเดี่ยวอยู่บน เหลือรูโหว่ใต้หัวข้อ 335–436px ทุกหน้า
   ย้ายเนื้อหาเข้าแผง แล้วให้ย่อหน้าลอยกึ่งกลางแผง ปุ่มอยู่ก้นแผง
   ที่ว่างที่เหลือกลายเป็นระยะขอบในกรอบ ไม่ใช่ช่องโหว่กลางจอ */
/* ไม่มีแถบส้มด้านซ้าย — แผงนี้สูงเต็มกรอบ แถบ 4px จึงกลายเป็นเส้นส้มยาวทั้งจอ
   แย่งสายตาไปจากตัวหนังสือ ปล่อยเป็นกรอบบาง ๆ เฉย ๆ (การ์ดฝั่งขวายังมีแถบอยู่) */
.veil .vl .vp{flex:1;min-height:0;margin-top:14px;position:relative;overflow:hidden;
  display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);
  border-radius:11px;padding:28px 30px 24px;
  box-shadow:0 2px 8px rgba(30,40,55,.05)}
/* margin auto บน-ล่าง = ย่อหน้าลอยกึ่งกลางที่ว่างที่เหลือ ปุ่มถูกดันไปชิดก้นแผง */
.veil .vl .vp>p{font-size:33px;line-height:1.34;margin:auto 0;color:var(--ink);
  font-weight:600;letter-spacing:-.006em;position:relative;z-index:1}
/* ── ภาพหน้าจอย่อส่วนในแผงซ้าย ──
   iframe ตัวเดียวกับหน้าจอจริง เรนเดอร์ที่ความกว้าง 1480 แล้วย่อด้วย transform
   กันคลิก (pointer-events:none) เพราะทั้งแผงเป็นปุ่มเปิดหน้าจอจริงอยู่แล้ว */
.veil .vl .vp:has(.vshot){padding:16px 16px 20px}
/* กล่องพรีวิวเป็นสัดส่วนจอแนวนอนคงที่ แล้วลอยกึ่งกลางแผง (margin auto บน-ล่าง)
   ถ้าปล่อยให้ยืดเต็มแผงที่เป็นทรงสูง หน้าจอข้างในจะถูกยืดจนดูไม่ออกว่าเป็นหน้าจออะไร */
.veil .vshot{width:100%;aspect-ratio:1480/940;margin:auto 0;flex:none;
  position:relative;overflow:hidden;border-radius:9px;
  border:1px solid var(--line);background:#eef4fb;box-shadow:0 2px 10px rgba(30,40,55,.08)}
.veil .vshot iframe{position:absolute;top:0;left:0;border:0;transform-origin:top left;
  pointer-events:none}
.veil .vgo{padding-top:22px;border-top:1px solid var(--line);position:relative;z-index:1}
.veil .vtip{display:block;font-size:13.5px;color:var(--grey);line-height:1.45;margin-top:13px}
/* คอลัมน์ขวา — ประโยชน์ 4 ข้อเรียงเป็นแถว ยืดเต็มความสูงกรอบพอดี
   การ์ดสูง 136px แต่ตัวหนังสือเดิมสูงแค่ 52px จึงขยายตัวอักษรให้เต็มการ์ดขึ้น */
.veil .vr ul{list-style:none;margin-top:14px;flex:1;min-height:0;display:grid;
  grid-auto-rows:1fr;gap:12px}
.veil .vr li{background:#fff;border:1px solid var(--line);border-left:4px solid var(--org);
  border-radius:11px;padding:14px 26px;display:flex;align-items:center;gap:24px;
  box-shadow:0 2px 8px rgba(30,40,55,.05)}
.veil .vr li i{flex:0 0 50px;font-style:normal;font-size:50px;font-weight:800;line-height:1;
  color:var(--org);text-align:center;letter-spacing:-.02em}
.veil .vr li .tx{min-width:0}
.veil .vr li b{display:block;font-size:23px;font-weight:800;line-height:1.25;color:var(--ink)}
.veil .vr li .tx>span{display:block;font-size:17px;color:var(--mut);line-height:1.45;
  margin-top:6px}
.frame .play{background:var(--org);color:#fff;border:0;border-radius:11px;padding:15px 32px;
  font-family:inherit;font-size:17px;font-weight:800;cursor:pointer;
  box-shadow:0 8px 22px rgba(255,128,6,.30);transition:.15s}
.frame .play:hover{background:var(--org-d);box-shadow:0 10px 26px rgba(255,128,6,.42)}
.screen .bar .tag{background:var(--green);color:#fff;font-size:11px;font-weight:700;
  border-radius:12px;padding:2px 10px;visibility:hidden}
.screen.live .bar .tag{visibility:visible}
.screen .bar .hint{font-size:11.5px;color:rgba(255,255,255,.6);display:none}
.screen.live .bar .hint{display:inline}
/* ปุ่มกลับไปแผงคำอธิบาย — โผล่เฉพาะตอนหน้าจอจริงเปิดอยู่
   ทำเป็นปุ่มโปร่งขอบบาง ไม่ใช่สีส้ม เพราะปุ่ม "เปิดเต็มจอ" ข้าง ๆ เป็นตัวหลักอยู่แล้ว
   ลูกค้าที่อยากอ่านคำอธิบายซ้ำจึงกดกลับได้ ไม่ต้องเดาว่าต้องกดลูกศรออกแล้วกดกลับ */
.screen .bar .back{display:none;font-family:inherit;color:#fff;background:transparent;
  border:1px solid rgba(255,255,255,.34);border-radius:7px;padding:4px 11px;font-size:12px;
  font-weight:700;cursor:pointer;transition:.15s}
.screen.live .bar .back{display:inline-block}
.screen .bar .back:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.6)}
/* คำอธิบายใต้จอ — เหลือเฉพาะหัวข้อสั้น ไม่มีคำขยาย */
.pins{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pin{background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--org);
  border-radius:8px;padding:0 13px;height:40px;display:flex;gap:10px;align-items:center}
.pin .n{flex:0 0 21px;height:21px;border-radius:50%;background:var(--org);color:#fff;font-weight:800;
  font-size:11.5px;display:flex;align-items:center;justify-content:center}
.pin b{font-size:13.5px;font-weight:700;line-height:1.25}
/* หัวสไลด์เดโมแบบกระชับ เพื่อคืนพื้นที่ให้จอโปรแกรม */
.demo-head{flex:0 0 auto;margin-bottom:11px}
.demo-head h2{font-size:31px;font-weight:800;letter-spacing:.01em;line-height:1.1;
  color:var(--ink);text-transform:uppercase}
.demo-head h2 em{font-style:normal;color:var(--org)}

/* ─── system workflow: การ์ดขั้นตอนต่อกันด้วยลูกศร + แถบสูตร ─── */
.fill{display:flex;flex-direction:column;min-height:0}
/* ─── flow เป็นกราฟฟิก: รางเส้นเดียวไล่สีตามขั้น + วงกลมเลขคร่อมบนราง ───
   --rail สร้างจากสีของทุกขั้นในตัว render จึงใช้ได้ทั้งสไลด์ Planning และ Costing
   ระยะ 100%/14 = จุดกึ่งกลางการ์ดใบแรก/ใบสุดท้าย รางจึงเริ่มและจบตรงวงกลมพอดี */
.fw{flex:0 0 auto;display:flex;gap:24px;position:relative;padding-top:46px;margin:auto 0}
.fw::before{content:'';position:absolute;top:20px;left:calc(100%/14);right:calc(100%/14);
  height:4px;border-radius:3px;background:var(--rail);opacity:.5}
.fw .stw{flex:1;min-width:0;position:relative;display:flex}
.fw .node{position:absolute;top:-46px;left:50%;transform:translateX(-50%);
  width:44px;height:44px;border-radius:50%;background:var(--c);color:#fff;
  font-size:18px;font-weight:800;font-style:normal;letter-spacing:0;
  display:flex;align-items:center;justify-content:center;z-index:2;
  box-shadow:0 0 0 7px #fff,0 3px 10px rgba(30,40,55,.2)}
/* หัวลูกศรบนราง บอกทิศทางว่าไหลไปทางไหน */
.fw .stw+.stw .node::before{content:'';position:absolute;left:-34px;top:50%;width:10px;height:10px;
  border-top:3px solid var(--line-d);border-right:3px solid var(--line-d);
  transform:translateY(-50%) rotate(45deg)}
.fw .st{flex:1;min-width:0;min-height:452px;position:relative;background:#fff;border:1px solid var(--line);
  border-top:5px solid var(--c);border-radius:12px;padding:22px 20px 16px;
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 2px 10px rgba(30,40,55,.06)}
.fw .st .cd{align-self:flex-start;font-size:12px;font-weight:800;letter-spacing:.1em;
  color:var(--c);background:var(--bg);border-radius:20px;padding:5px 12px}
.fw .st .nm{font-size:25px;font-weight:800;line-height:1.16;margin-top:15px;color:var(--ink)}
.fw .st .ds{font-size:16.5px;line-height:1.45;margin-top:11px;color:var(--mut)}
.fw .st .no{position:absolute;right:4px;bottom:-42px;font-size:168px;font-weight:800;
  line-height:1;color:var(--c);opacity:.10;pointer-events:none}
.fx{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:18px}
.fx .f{background:var(--bg2);border:1px solid var(--line);border-top:5px solid var(--c);
  border-radius:10px;padding:20px 22px;display:flex;flex-direction:column;justify-content:center;min-height:0}
.fx .f .lb{font-size:13.5px;font-weight:800;letter-spacing:.1em;color:var(--c);text-transform:uppercase}
.fx .f .eq{font-family:"SFMono-Regular",Menlo,Consolas,monospace;font-size:17px;font-weight:600;
  line-height:1.55;margin-top:13px;color:var(--ink);background:#fff;border:1px solid var(--line);
  border-radius:8px;padding:14px 16px}
.fx .f .ex{font-size:16px;color:var(--mut);line-height:1.45;margin-top:14px}


/* ─── Costing flow: แตกจากข้อมูลหลัก → 4 ส่วนประกอบคู่ขนาน → รวมเป็น Cost Book → Simulation
   วางบนผืนพิกัดตายตัว 1470×700 เพราะ .sheet เป็น 1600×900 คงที่แล้วค่อยสเกลทั้งแผ่น
   ผืนกินพื้นที่ .fill เกือบเต็ม (ว่างจริง 1482×720) — ตัวหนังสือจึงใหญ่พอสำหรับท้ายห้อง
   เส้นโค้งวาดด้วย SVG จึงคุมหัวลูกศรและจุดบรรจบได้ตรงขอบกล่องพอดี            */
.cflow{position:relative;width:1470px;height:700px;margin:auto;flex:0 0 auto}
.cflow .cwire{position:absolute;inset:0;overflow:visible}
.cflow .cwire>path{fill:none;stroke-width:3.6;stroke-linecap:round;opacity:.72}
.cflow .box{position:absolute;background:#fff;border:1px solid var(--line);border-radius:14px;
  box-shadow:0 2px 12px rgba(30,40,55,.07);display:flex;flex-direction:column;justify-content:center}
.cflow .cd{align-self:flex-start;font-size:15px;font-weight:800;letter-spacing:.1em;
  color:var(--c);background:var(--bg);border-radius:20px;padding:5px 14px}
.cflow .nm{font-weight:800;color:var(--ink);line-height:1.15}
.cflow .ds{color:var(--mut);line-height:1.42}
/* ต้นทาง — ข้อมูลหลัก */
.cflow .hub{left:0;top:210px;width:280px;height:280px;border-radius:50%;
  border:3px solid var(--c);align-items:center;text-align:center;padding:0 30px}
.cflow .hub .cd{align-self:center}
.cflow .hub .nm{font-size:30px;margin-top:12px}
.cflow .hub .ds{font-size:19px;margin-top:10px}
/* 4 ส่วนประกอบ — .ds เพดานอยู่ที่ 19px เพราะ 'Standard minutes × rate per cost centre'
   (EN, บรรทัดที่ยาวที่สุด) เริ่มตัดบรรทัดที่ 19.5px บนความกว้างเนื้อหา 334px
   ถ้าปล่อยให้ตัด การ์ดใบเดียวจะสูงกว่าเพื่อน ปลายเส้นก็เลยไม่ชนกึ่งกลาง        */
.cflow .comp{left:385px;width:390px;padding:18px 24px;border-left:7px solid var(--c)}

.cflow .comp .nm{font-size:28px;margin-top:9px}
.cflow .comp .ds{font-size:19px;margin-top:6px}
/* ปลายทาง — Cost Book เป็นพระเอก ถมสีทึบ */
.cflow .book{left:925px;top:230px;width:300px;height:240px;padding:0 26px;
  background:var(--c);border-color:var(--c);box-shadow:0 6px 20px -6px rgba(30,40,55,.35)}
.cflow .book .cd{background:rgba(255,255,255,.9)}
.cflow .book .nm{font-size:37px;color:#fff;margin-top:13px}
.cflow .book .ds{font-size:20.5px;color:rgba(255,255,255,.92);margin-top:10px}
/* ต่อยอด — Simulation */
.cflow .sim{left:1255px;top:250px;width:215px;height:200px;padding:0 22px;
  border-left:7px solid var(--c)}
/* สูตรประกอบร่าง — วางใต้ Cost Book เพราะเป็นตัวอธิบายว่า 4 ส่วนบนรวมกันยังไง */
.cflow .eqn{position:absolute;left:895px;top:488px;width:360px;text-align:center;
  font-family:"SFMono-Regular",Menlo,Consolas,monospace;font-size:18.5px;font-weight:600;
  line-height:1.5;color:var(--org-d);background:var(--org-l);border-radius:9px;padding:12px 14px}
.cflow .sim .nm{font-size:29px;margin-top:10px}
.cflow .sim .ds{font-size:20px;margin-top:7px}


/* ─── Planning flow: 2 ก้อนใหญ่ + ปลายทาง + แถบสูตร ──────────────────────
   7 ขั้นยุบเหลือ 3 ชิ้นให้ตาจับ — ฝั่งวางแผนผลิต (FR-1.x) · ฝั่งวางแผนวัตถุดิบ
   (FR-2.x, FR-6) · แล้วส่งกลับ ERP  การแบ่งตรงกับรหัส FR ในเอกสารพอดี
   หน้าอ่านเป็น 3 ชั้น: สายงาน → สูตรที่อยู่เบื้องหลัง → บรรทัดปิดท้าย
   ชั้นบนยืดกินที่ว่างที่เหลือทั้งหมด หน้าจึงไม่เหลือช่องว่างลอย ๆ บนล่าง
   วางด้วย grid ไม่ใช่พิกัด absolute — สลับภาษาแล้วข้อความยาวขึ้นก็ไม่ล้นกรอบ */
.gwrap{gap:18px}
.gflow{flex:1 1 auto;min-height:0;display:grid;align-items:stretch;
  grid-template-columns:1fr 60px 1fr 60px 340px}
.gflow .pan{position:relative;overflow:hidden;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#fff 0%,var(--bg2) 100%);
  border:1px solid var(--line);border-radius:18px;padding:20px 24px 16px;
  box-shadow:0 4px 16px -12px rgba(35,42,64,.75)}
.gflow .pan::before,.gflow .term::before{content:'';position:absolute;left:0;right:0;top:0;
  height:5px;background:var(--c)}
.gflow .ph{flex:0 0 auto;display:flex;align-items:center;gap:11px;
  font-size:20px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--c);
  padding-bottom:14px;border-bottom:1px solid var(--line)}
.gflow .ph b{flex:0 0 auto;width:11px;height:11px;border-radius:50%;background:var(--c)}
.gflow .ps{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
/* ทุกขั้นสูงเท่ากันและจัดกึ่งกลางแนวตั้ง ระยะห่างจึงเท่ากันหมดโดยไม่ต้องตั้งค่าเอง
   และไม่เหลือช่องว่างค้างใต้ขั้นสุดท้าย */
.gflow .gr{flex:1 1 0;min-height:0;position:relative;display:flex;align-items:center;gap:16px}
.gflow .gr+.gr{border-top:1px solid var(--line)}   /* แบ่งเป็นแถบ ที่ว่างจึงอ่านเป็นจังหวะ ไม่ใช่ช่องโหว่ */
/* เส้นไต่จากเลขข้อลงไปหาข้อถัดไป — สายตารู้ทันทีว่าเป็นลำดับ ไม่ใช่ 3 กล่องวางเรียงกันเฉย ๆ
   เส้นลากเต็มความสูงแถวแล้วให้วงกลมทึบทับบัง หัวท้ายจึงไม่มีเส้นโผล่ */
.gflow .gr::before{content:'';position:absolute;left:24px;top:0;bottom:0;width:2px;background:var(--line-d)}
.gflow .gr:first-child::before{top:50%}
.gflow .gr:last-child::before{bottom:50%}
.gflow .gn{position:relative;z-index:1;flex:0 0 50px;width:50px;height:50px;border-radius:50%;
  background:var(--c);color:#fff;font-size:21px;font-weight:800;font-style:normal;
  display:flex;align-items:center;justify-content:center;box-shadow:0 3px 9px -4px var(--c)}
.gflow .gt{flex:1;min-width:0;padding-top:1px}
.gflow .gl{display:flex;align-items:center;gap:12px}
.gflow .gnm{font-size:34px;font-weight:800;color:var(--ink);line-height:1.16}
.gflow .gcd{margin-left:auto;flex:0 0 auto;font-size:15px;font-weight:800;letter-spacing:.09em;
  color:var(--c);background:#fff;border:1px solid var(--c);border-radius:20px;padding:5px 15px}
.gflow .gds{display:block;font-size:21px;color:var(--mut);line-height:1.45;margin-top:7px}
.gflow .garr{display:flex;align-items:center;justify-content:center}
/* ปลายทาง — ส่งกลับ ERP ถมสีเข้มให้เป็นจุดจบสายตา
   ขอบบนไล่สีแดง→ส้ม เพราะสีแดงเดี่ยว ๆ บนพื้นเข้มแทบมองไม่เห็น */
.gflow .term{position:relative;overflow:hidden;color:#fff;border-radius:18px;padding:0 28px;
  background:linear-gradient(155deg,#3A4152 0%,#202634 62%,#171C27 100%);
  display:flex;flex-direction:column;justify-content:center;
  box-shadow:0 16px 32px -18px rgba(20,26,40,.85)}
.gflow .term::before{background:linear-gradient(90deg,var(--c) 0%,var(--org) 100%)}
.gflow .term .wm{position:absolute;right:-30px;bottom:-34px;width:214px;height:214px;opacity:.085}
.gflow .term .eb{font-size:15px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  color:var(--org)}
.gflow .term .gl{margin-top:14px}
.gflow .term .gnm{font-size:42px;color:#fff}
.gflow .term .gcd{color:#fff;background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.3)}
.gflow .term .gds{max-width:268px;font-size:21px;color:rgba(255,255,255,.84);margin-top:12px}
/* ชั้นสอง — สูตรที่อยู่เบื้องหลัง 3 ขั้นสำคัญ ผูกสีกับขั้นตอนบนโดยตรง */
.gwrap .eqh{flex:0 0 auto;display:flex;align-items:center;gap:14px;
  font-size:14px;font-weight:800;letter-spacing:.17em;text-transform:uppercase;color:var(--grey)}
.gwrap .eqh::after{content:'';flex:1;height:1px;background:var(--line)}
.gwrap .eqs{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.gwrap .eq{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px;
  background:var(--bg2);padding:14px 19px 15px}
.gwrap .eq .k{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--c)}
.gwrap .eq .m{display:block;margin-top:8px;font-family:"SFMono-Regular",Menlo,Consolas,monospace;
  font-size:15.5px;font-weight:600;line-height:1.45;color:var(--ink)}
.gwrap .eq .n{display:block;margin-top:7px;font-size:15px;color:var(--mut);line-height:1.45}
.gwrap .gfoot{flex:0 0 auto;display:flex;align-items:flex-start;gap:12px;
  font-size:16px;color:var(--mut);line-height:1.45}
.gwrap .gfoot::before{content:'';flex:0 0 4px;width:4px;height:18px;border-radius:2px;
  background:var(--org);margin-top:2px}

/* ─── timeline (Gantt) ─────────────────────────────────────────
   · แท่งงานเป็นชิ้นเดียวยาวต่อเนื่องด้วย grid-column span ไม่ใช่ช่องรายสัปดาห์ต่อกัน
   · หัวตารางสองชั้น เดือน → สัปดาห์ ให้มีลำดับชั้น ไม่ใช่เส้น 11 เส้นเท่ากันหมด
   · ชื่องานชิดขวาเข้าหากราฟ สายตาไม่ต้องกระโดดข้ามช่องว่าง 300px
   · สีอ่อนทั้งกราฟ ตัวหนังสือในแท่งเป็นสีเข้ม — น้ำหนักสายตาไปที่ชื่อเรื่องก่อน */
/* --lbw 340 ไม่ใช่ 296 เพราะชื่องาน EN ที่ยาวที่สุด ('Training, install and acceptance'
   กับ 'Master data preparation (APEX)') เริ่มตัดสองบรรทัดที่ 20px บนคอลัมน์ 296px
   ขยายคอลัมน์ให้ชื่อยังอยู่บรรทัดเดียวที่ 21px — กราฟเสียไป 44px ไม่กระทบแท่งงาน */
.tl{--lbw:340px;--tlbar:#B9CBD9;--tlbar2:#C7D5E0;--tltx:#33536B;
  display:flex;flex-direction:column;min-height:0}
.tl .tlhd{flex:0 0 auto;display:grid;grid-template-columns:var(--lbw) 1fr}
.tl .mo{display:grid;grid-template-columns:repeat(var(--w),1fr);margin-bottom:8px}
.tl .mo span{grid-row:1;font-size:14px;font-weight:800;letter-spacing:.16em;color:var(--grey);
  text-transform:uppercase;text-align:center}
.tl .wk{display:grid;grid-template-columns:repeat(var(--w),1fr);margin-bottom:9px}
.tl .wk span{font-size:17px;font-weight:700;color:var(--mut);text-align:center;letter-spacing:.04em}
.tl .tlbd{position:relative;flex:1;min-height:0;display:flex;
  border-top:1px solid var(--line-d);border-bottom:1px solid var(--line)}
.tl .lines{position:absolute;inset:0 0 0 var(--lbw);pointer-events:none;
  display:grid;grid-template-columns:repeat(var(--w),1fr)}
.tl .lines i{border-left:1px solid rgba(65,64,65,.06)}
.tl .lines i.mb{border-left-color:rgba(65,64,65,.16)}    /* ขอบเดือน — เข้มกว่าเส้นสัปดาห์ */
.tl .lines i.gl{background:rgba(255,128,6,.05)}           /* สัปดาห์ที่ใช้งานจริง */
/* หมุดหมาย — วางกึ่งกลางสัปดาห์นั้น อ่านได้ว่า "ภายในสัปดาห์นี้" ไม่ทับขอบตาราง */
.tl .mk{position:absolute;inset:0 0 0 var(--lbw);pointer-events:none;z-index:2}
.tl .mk u{position:absolute;top:0;bottom:0;border-left:1px dashed rgba(65,64,65,.17)}
.tl .mk u::before{content:'';position:absolute;left:-6px;top:-7px;width:12px;height:12px;
  background:var(--org);transform:rotate(45deg);border-radius:2px}
.tl .rows{position:relative;z-index:1;flex:1;min-width:0;display:grid;grid-auto-rows:1fr}
.tl .r{display:grid;grid-template-columns:var(--lbw) 1fr;align-items:center}
.tl .r .lb{text-align:right;padding-right:28px;font-size:21px;font-weight:500;
  color:var(--ink);line-height:1.25}
.tl .trk{display:grid;grid-template-columns:repeat(var(--w),1fr);align-items:center}
/* แท่งสูง 52 ในแถว ~68 — เหลือช่องไฟระหว่างแถว 16px แท่งยังไม่ชนกัน */
.tl .bar{height:52px;margin:0 3px;border-radius:999px;
  background:linear-gradient(180deg,var(--tlbar2),var(--tlbar));
  border:1px solid rgba(51,83,107,.16);
  display:flex;align-items:center;justify-content:flex-end;padding:0 22px;
  color:var(--tltx);font-size:17px;font-weight:700;letter-spacing:.02em}
/* หมุดหมายด้านล่าง — บรรทัดข้อความคั่นด้วยเส้นบาง ไม่มีกล่อง ไม่มีเงา */
.ms{display:grid;grid-template-columns:repeat(5,1fr);margin-top:18px;
  border-top:1px solid var(--line)}
.ms .m{padding:14px 20px 0 0;display:flex;align-items:baseline;gap:10px}
.ms .m+.m{padding-left:24px;border-left:1px solid var(--line)}
.ms .m b{flex:0 0 auto;font-size:17px;font-weight:800;color:var(--org-d);letter-spacing:.03em}
.ms .m span{font-size:18px;line-height:1.35;color:var(--mut)}

/* ── หน้าปก / หน้าคั่น (Title Slide · พื้นเข้ม #414042) ── */
.sheet.dark{background:#414042}
.sheet.dark .gb{padding:0}
.cover{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;
  padding:0 93px;overflow:hidden}

.cover .obar{position:absolute;left:54px;top:0;width:251px;height:20px;background:var(--org)}

/* หน้าปกเหลือข้อมูลชิ้นเดียว (จัดทำให้) — ตัวหนังสือจึงขยายได้ทั้งชุด
   ชื่อเรื่อง 72px ยังพอดีกล่อง 1414px ทั้งอังกฤษและไทย ไม่ตกบรรทัด */
.cover .kick{font-size:15px;letter-spacing:.26em;color:#fff;font-weight:700;opacity:.72}
.cover h1{font-size:72px;font-weight:800;line-height:1.1;margin-top:18px;color:#FF8220;
  text-transform:uppercase;letter-spacing:.04em}
.cover .bar{width:140px;height:7px;background:#fff;opacity:.35;margin:30px 0 26px}
.cover .lead{font-size:23px;color:#F3F3F3;opacity:.9;max-width:1120px;line-height:1.55}
.cover .meta{display:flex;gap:60px;margin-top:52px;flex-wrap:wrap}
.cover .meta div b{display:block;font-size:13px;letter-spacing:.13em;color:var(--org);font-weight:800}
.cover .meta div span{display:block;font-size:22px;margin-top:8px;font-weight:600;color:#fff}
/* โหมดนำเสนอเต็มจอ — ซ่อนแถบควบคุม สไลด์กินพื้นที่ทั้งจอ */
body.fs header{display:none}
body.fs .stage{padding:0;align-items:center;background:#2E2E2F}
body.fs .sheet{box-shadow:none}
@media print{header,nav,.edge,.scrim{display:none}.stage{padding:0}.sheet{box-shadow:none}}
</style>

flowp:s=>{
  const st=s.steps, G=s.groups||['',''], term=st[6];
  const P=[[G[0],st.slice(0,3),st[1][3]],[G[1],st.slice(3,6),st[4][3]]];   /* ชื่อก้อน, 3 ขั้น, สีก้อน */
  /* ลูกศรไล่สีจากก้อนก่อนหน้าไปหาก้อนถัดไป — ตาอ่านว่าเป็นของชิ้นเดียวกันที่ไหลต่อ ไม่ใช่เส้นคั่น */
  /* gradientUnits ต้องเป็น userSpaceOnUse — เส้นแนวนอนมี bounding box สูงศูนย์
     ถ้าใช้ objectBoundingBox (ค่าตั้งต้น) Chrome จะไม่วาดเส้นให้เลย */
  const arr=(id,a,b)=>`<div class="garr"><svg viewBox="0 0 56 26" width="56" height="26">
    <defs><linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="2" y1="13" x2="53" y2="13">
      <stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs>
    <path d="M2,13 H39" fill="none" stroke="url(#${id})" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M37,5.5 L53,13 L37,20.5 z" fill="${b}"/></svg></div>`;
  const row=(d,n)=>`<div class="gr" style="--c:${d[3]}"><i class="gn">${n}</i>
    <div class="gt"><div class="gl"><span class="gnm">${d[1]}</span><span class="gcd">${d[0]}</span></div>
      <span class="gds">${d[2]}</span></div></div>`;
  const pan=([t,items,col],gi)=>`<div class="pan" style="--c:${col}"><div class="ph"><b></b>${t}</div>
    <div class="ps">${items.map((d,i)=>row(d,gi*3+i+1)).join('')}</div></div>`;
  const wm=`<svg class="wm" viewBox="0 0 100 100" fill="none" stroke="#fff" stroke-width="4">
    <ellipse cx="50" cy="24" rx="30" ry="11"/><path d="M20,24 V76 a30,11 0 0 0 60,0 V24"/>
    <path d="M20,50 a30,11 0 0 0 60,0"/></svg>`;
  return head(s)+`<div class="fill gwrap">
    <div class="gflow">${pan(P[0],0)}${arr('fa',P[0][2],P[1][2])}${pan(P[1],1)}${arr('fb',P[1][2],term[3])}
      <div class="term" style="--c:${term[3]}">${wm}<div class="eb">${U('f_out')}</div>
        <div class="gl"><span class="gnm">${term[1]}</span><span class="gcd">${term[0]}</span></div>
        <span class="gds">${term[2]}</span></div></div>
    </div>`;   /* บล็อกสูตร 3 ใบ + บรรทัดท้าย ถูกเอาออกตามที่เจ้าของงานสั่ง
                  CSS .eqh/.eqs/.gfoot ยังอยู่ ใส่กลับได้ด้วยการคืนสองบรรทัดนี้ */
},

flowc:s=>{
  /* st[4] = Waste & Scrap Resale ไม่แสดงบนภาพ — มันเป็นส่วนหนึ่งของ DM ไม่ใช่ขั้นตอนของตัวเอง
     (ข้อมูลยังอยู่ใน steps[] เผื่ออยากเอากลับ) จึงเหลือ 3 สายเข้า Cost Book */
  const st=s.steps, hub=st[0], comp=st.slice(1,4), book=st[5], sim=st[6];
  /* ── เรขาคณิตของเส้น ────────────────────────────────────────────────
     HX,HY = จุดศูนย์กลางวงกลมต้นทาง · HR = รัศมี
     เส้นแต่ละเส้น "ออกจากขอบวงกลมตรงมุมที่เล็งไปหากล่องของตัวเอง" ไม่ได้ออก
     จุดเดียวกันหมด — โคนเส้นจึงไม่บีบกัน และระยะไต่ขึ้นลงสั้นลงมาก
     คุมความโค้งด้วย control point ที่ยื่นตามแนวนอนเท่ากันทุกเส้น (BOW)
     เส้นจึงมีสำนวนโค้งชุดเดียวกัน ไม่ใช่ต่างคนต่างโค้ง                  */
  const CH=[158,158,158];                    /* ค่าที่วัดจากของจริง ปลายเส้นจึงชนกึ่งกลางการ์ดพอดี */
  const GAP=36, TOP=350-(CH.reduce((a,b)=>a+b,0)+GAP*(CH.length-1))/2;
  const TY=CH.map((h,i)=>TOP+CH.slice(0,i).reduce((a,b)=>a+b+GAP,0));
  const CY=TY.map((t,i)=>t+CH[i]/2);
  const HX=140, HY=350, HR=140, CL=385, CR=775, JX=905, BOW=56;
  const ex=CY.map(y=>{const a=Math.atan2(y-HY,CL-HX);
    return [HX+HR*Math.cos(a), HY+HR*Math.sin(a)];});
  const f=n=>n.toFixed(1);
  const mk=(id,c)=>`<marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"
      markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="${c}"/></marker>`;
  const dot=(x,y,r,c)=>`<circle cx="${f(x)}" cy="${f(y)}" r="${r}" fill="${c}" stroke="#fff" stroke-width="3"/>`;
  const wire=`<svg class="cwire" viewBox="0 0 1470 700" width="1470" height="700"><defs>
      ${comp.map((c,i)=>mk('ar'+i,c[3])).join('')}${mk('arb',book[3])}${mk('ars',sim[3])}</defs>
    ${comp.map((c,i)=>`
      <path d="M${f(ex[i][0])},${f(ex[i][1])} C${f(ex[i][0]+BOW)},${f(ex[i][1])} ${CL-BOW},${CY[i]} ${CL-7},${CY[i]}"
            stroke="${c[3]}" marker-end="url(#ar${i})"/>
      <path d="M${CR},${CY[i]} C${CR+BOW},${CY[i]} ${JX-BOW},${HY} ${JX},${HY}" stroke="${c[3]}"/>`).join('')}
    ${comp.map((c,i)=>dot(ex[i][0],ex[i][1],7,c[3])).join('')}
    ${dot(JX,HY,9,book[3])}
    <path d="M${JX},${HY} H919" stroke="${book[3]}" marker-end="url(#arb)"/>
    <path d="M1225,${HY} H1249" stroke="${sim[3]}" marker-end="url(#ars)"/></svg>`;
  const bx=(cls,d,extra='')=>`<div class="box ${cls}" style="--c:${d[3]}${extra}">
    <span class="cd">${d[0]}</span><span class="nm">${d[1]}</span><span class="ds">${d[2]}</span></div>`;
  return head(s)+`<div class="fill"><div class="cflow">${wire}
    ${bx('hub',hub)}
    ${comp.map((c,i)=>`<div class="box comp" style="--c:${c[3]};top:${TY[i]}px;min-height:${CH[i]}px">
      <span class="cd">${c[0]}</span><span class="nm">${c[1]}</span><span class="ds">${c[2]}</span>
      </div>`).join('')}
    ${bx('book',book)}${bx('sim',sim)}
    <!-- บรรทัดสมการ "Standard cost = DM + DL + OH + Waste − Scrap Resale" ถอดออกตามคำสั่งเจ้าของงาน
         สูตรยังเก็บไว้ใน SLIDES[].formulas / TH[].formulas เผื่อเปิดกลับ (เหมือน lead กับ foot) -->
    </div></div>`;
},

/* จำนวนคอลัมน์วิ่งตามจำนวนกลุ่ม — ถ้าเหลือกลุ่มเดียวการ์ดกินเต็มความกว้าง
   แล้วแตกรายการเป็นสองคอลัมน์ (คลาส solo) ไล่จากซ้ายลงล่างก่อนขึ้นคอลัมน์ขวา */
prereq:s=>{const solo=s.groups.length===1;
  return head(s)+`<div class="grid" style="grid-template-columns:repeat(${s.groups.length},1fr)">
  ${s.groups.map(([t,c,items])=>{const rw=Math.ceil(items.length/2);
    return `<div class="card prqc${solo?' solo':''}" style="--c:${c}"><h4>${t}</h4>
    <ul${solo?` style="grid-template-rows:repeat(${rw},1fr)"`:''}>${
      items.map((x,i)=>`<li${solo&&(i+1)%rw===0?' class="lr"':''}>${x}</li>`).join('')}</ul></div>`;
  }).join('')}</div>`;},

server:s=>head(s)+`<div class="grid g2 srv">
  <div><h4 style="font-size:16px;letter-spacing:.1em;color:var(--org);margin-bottom:10px">${U('s_app')}</h4>
  <table class="tb"><tr><th>${U('s_cu')}</th><th>CPU</th><th>RAM</th><th>${U('s_st')}</th></tr>
  ${s.app.map(r=>`<tr>${r.map((c,i)=>`<td${i===0?' style="font-weight:700"':''}>${c}</td>`).join('')}</tr>`).join('')}</table></div>
  <div><h4 style="font-size:16px;letter-spacing:.1em;color:var(--org);margin-bottom:10px">${U('s_db')}</h4>
  <table class="tb"><tr><th>${U('s_tier')}</th><th>CPU</th><th>RAM</th><th>${U('s_st')}</th></tr>
  ${s.db.map(r=>`<tr>${r.map((c,i)=>`<td${i===0?' style="font-weight:700"':''}>${c}</td>`).join('')}</tr>`).join('')}</table></div></div>`,

tech:s=>head(s)+`<table class="tb tech">
  <tr><th style="width:19%">${U('t_layer')}</th><th>${U('t_tech')}</th></tr>
  ${s.rows.map(([a,b])=>`<tr><td style="font-weight:700">${a}</td><td>${b}</td></tr>`).join('')}</table>`,

/* การ์ดสรุป 3 ใบถูกเอาออกตามที่เจ้าของงานสั่ง — ข้อมูล pts[] ยังอยู่ในเด็คทั้งสองภาษา ใส่กลับได้ทันที */
qa:s=>`<div class="fill" style="display:flex;flex-direction:column;justify-content:center;text-align:center">
  <h2 class="tt" style="font-size:104px;line-height:1.1">${s.tt}</h2>
  <div class="rule" style="margin:30px auto 0;width:190px;height:7px"></div></div>`
};

function buildNav(){
  g('navlist').innerHTML=SLIDES.map((_,i)=>{const s=S(i);return `<a href="#${s.k}" data-i="${i}">
  <span class="idx">${i+1}</span><span class="txt"><span class="nm">${s.nm}</span>
  <span class="cd">${s.cd}${s.type==='demo'?'<span class="bd">LIVE</span>':''}</span></span></a>`;}).join('');
  document.querySelectorAll('#navlist a').forEach((a,i)=>a.classList.toggle('on',i===cur));
}
g('count').textContent='1 / '+SLIDES.length;

let cur=0, zoom='page';        /* นำเสนอแบบเต็มหน้าเป็นค่าตั้งต้น */
const AUTOLIVE=/(\?|&)live=1(&|$)/.test(location.search);

/* ── ภาษาของหน้าจอที่ฝังอยู่ในสไลด์ ───────────────────────────────
   หน้าจอเดโมอ่านภาษาจาก localStorage['apex_lang'] (apex-i18n.js)
   เด็คนี้ตั้งต้นเป็น EN เพราะใช้นำเสนอภาษาอังกฤษ สลับได้จากปุ่มบนหัว */
let plang='en';
try{plang=localStorage.getItem('apexPresLang')||'en';}catch(e){}
function setLang(l){
  plang=l;
  try{localStorage.setItem('apex_lang',l);localStorage.setItem('apexPresLang',l);}catch(e){}
  document.querySelectorAll('#lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));
  document.documentElement.lang=l;
  document.querySelector('header .sub').innerHTML=U('sub');
  document.querySelector('nav .head .t').textContent=U('slides');
  document.querySelector('#zoom button[data-m="width"]').textContent=U('fitw');
  document.querySelector('#zoom button[data-m="page"]').textContent=U('fitp');
  document.querySelectorAll('.frame.live iframe').forEach(f=>{      /* จอที่เปิดอยู่สลับทันที */
    try{f.contentWindow.postMessage({apexLang:l},'*');}catch(e){}
  });
  if(g('sheet')){buildNav();render();}   /* สลับตัวสไลด์ด้วย ไม่ใช่แค่จอที่ฝัง */
}
setLang(plang);
document.querySelectorAll('#lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));

/* ── ซูมหน้าจอในกรอบเดโม ─────────────────────────────────────────
   1480 = ความกว้างกรอบจริง · render แคบกว่านั้นแล้วขยายกลับ = ตัวหนังสือใหญ่ขึ้น
   ปรับสดตอนซ้อมด้วย [ และ ] ค่าจำไว้ในเครื่อง */
const FRAME_W=1480, VW_DEF=1220;
/* ความสูง viewport ของภาพพรีวิวในหน้ากาก — ต้องตรงกับ aspect-ratio ของ .vshot */
const SHOT_H=940;
let vwAdj=0, autoVw=0;
try{vwAdj=parseInt(localStorage.getItem('apexPresVwAdj'),10)||0;}catch(e){}
function applyDemoZoom(){
  const f=document.querySelector('.frame'); if(!f) return;
  const ifr=f.querySelector(':scope>iframe');
  const base=+(f.dataset.vw||0)||VW_DEF;
  const w=Math.max(1000,Math.min(FRAME_W,base+vwAdj+autoVw));
  const sc=FRAME_W/w;
  ifr.style.width=w+'px';
  /* ความสูงต้องเท่ากับกรอบหารด้วยอัตราซูม — หน้าจอข้างในจึงมี viewport จริง
     แล้วเลื่อนดูเนื้อหาส่วนล่างได้เอง (ถ้าปล่อยสูง 1400px จะไม่มีอะไรให้เลื่อน
     เพราะเนื้อหาพอดี viewport แล้วถูกกรอบครอบตัดทิ้ง) */
  ifr.style.height=Math.round(f.clientHeight/sc)+'px';
  ifr.style.transform='scale('+sc.toFixed(4)+')';
}
/* ปิดหน้าจอจริงกลับไปแผงคำอธิบาย — คืนค่าเท่าที่ start() ทำไว้ ไม่แตะ src ของ iframe */
function unlive(){
  const f=document.querySelector('.frame.live'); if(!f) return false;
  f.classList.remove('live');f.closest('.screen').classList.remove('live');
  autoVw=0;applyDemoZoom();      /* ป๊อปอัพในหน้าลูกอาจถ่างกรอบไว้ — คืนความกว้างเดิม */
  /* ต้องวัดใหม่หลังแผงกลับมาเห็น: ถ้าเข้าด้วย ?live=1 ตอน render() แผงยัง display:none
     อยู่ mountShot() เลยวัดความกว้างได้ 0 แล้วข้ามการย่อภาพไปเลย */
  mountShot();
  return true;
}
/* เลื่อนหน้าจอในกรอบจากปุ่มคีย์บอร์ด — ตอนนำเสนอมือไม่ต้องอยู่บนจอ */
function scrollDemo(dy){
  const f=document.querySelector('.frame.live'); if(!f) return false;
  const w=f.querySelector(':scope>iframe').contentWindow;
  try{w.scrollBy({top:dy,behavior:'smooth'});}catch(e){return false;}
  return true;
}
function stepZoom(d){
  vwAdj=Math.max(-220,Math.min(260,vwAdj+d));
  try{localStorage.setItem('apexPresVwAdj',vwAdj);}catch(e){}
  applyDemoZoom();
}
/* ── ป๊อปอัพในหน้าจอเดโมกว้างเกินกรอบ → ขยาย viewport ของกรอบให้เอง ──────
   apex-fit ในหน้าลูกขยายกล่องป๊อปอัพจนเต็มพื้นที่ที่มีก่อนแล้ว ถ้ายังไม่พออีก
   (ตารางกว้างกว่าจอจริง ๆ) ค่อยขยายจอในกรอบต่อ ได้ถึง 1480 = ขนาดกรอบจริง
   ปิดป๊อปอัพแล้วกลับขนาดเดิม ตัวหนังสือบนหน้าจอหลักจึงใหญ่เท่าเดิม
   ⚠ ห้ามใส่ CSS transition ให้ .frame iframe — หน้าลูกจะอ่าน viewport ได้ค่าเก่า */
function autoWidenDemo(){
  const f=document.querySelector('.frame.live'); if(!f) return;
  let cw,st;
  try{ cw=f.querySelector(':scope>iframe').contentWindow;
       st=cw.ApexFit&&cw.ApexFit.dlgFit&&cw.ApexFit.dlgFit(); }catch(e){ return; }
  if(!st) return;
  /* กรอบเปลี่ยนขนาดแล้วต้องสั่งหน้าลูกจัดใหม่ทันที ไม่รอ event resize ของมันเอง */
  const apply=()=>{applyDemoZoom();try{cw.ApexFit.refresh();}catch(e){}};
  if(!st.open){ if(autoVw){autoVw=0;apply();} return; }           /* ปิดป๊อปอัพแล้ว */
  if(st.need<=2) return;
  const base=+(f.dataset.vw||0)||VW_DEF;
  const room=FRAME_W-Math.max(1000,Math.min(FRAME_W,base+vwAdj+autoVw));
  if(room<=0) return;                                            /* กว้างสุดแล้ว */
  autoVw+=Math.min(st.need+12,room);
  apply();
}
setInterval(autoWidenDemo,450);
function render(){
  const s=S(cur), isCover=s.type==='cover', isDemo=s.type==='demo';
  g('stage').innerHTML=`<div class="sheet${isCover?' dark':''}" id="sheet">
    ${isCover?'':'<div class="gh"><img src="gable-logo-dark.png" alt="G-Able" /></div>'}
    <div class="gb${isDemo?' dm':''}">${R[s.type](s)}</div>
    ${isCover?'':`<div class="gf"><img src="gable-bar.png" alt="" />
      <span class="pg">${cur+1} / ${SLIDES.length}</span>
      <span class="cf">Copyright @ G-ABLE Public Company Limited</span></div>`}</div>`;
  document.querySelectorAll('#navlist a').forEach((a,i)=>a.classList.toggle('on',i===cur));
  g('count').textContent=(cur+1)+' / '+SLIDES.length;
  /* ในกรอบ srcdoc (พรีวิวในแชท) เอกสารไม่มี URL จริง replaceState จะโยน SecurityError */
  try{history.replaceState(null,'','#'+s.k);}catch(e){}
  autoVw=0;                      /* สไลด์ใหม่ = เริ่มนับความกว้างที่ต้องเพิ่มใหม่ */
  applyDemoZoom();
  const f=document.querySelector('.frame');
  if(f){
    const start=()=>{const ifr=f.querySelector(':scope>iframe');
      if(ifr.src.indexOf('about:blank')>=0) ifr.src=f.dataset.src;
      f.classList.add('live');f.closest('.screen').classList.add('live');};
    f.querySelector('.play').onclick=start;
    f.querySelector('.veil').onclick=start;
    /* กลับไปแผงคำอธิบาย — ไม่ล้าง src ของ iframe หน้าจอจริงจึงยังค้างอยู่
       กด "เปิดหน้าจอจริง" อีกทีก็กลับมาทันที ไม่ต้องโหลดใหม่ */
    document.querySelector('.screen .back').onclick=e=>{e.stopPropagation();unlive();};
    if(AUTOLIVE) start();          /* ?live=1 → เปิดสไลด์มาแล้วเล่นเลย */
  }
  mountShot();
  fit();
}

/* ── ภาพหน้าจอย่อส่วนในแผงซ้ายของหน้ากาก ──
   เรนเดอร์หน้าจอจริงที่ความกว้าง 1480 (เท่ากรอบใหญ่) แล้วย่อด้วย transform ให้พอดีแผง
   ความสูงตั้งเป็น "ความสูงแผง ÷ อัตราย่อ" หน้าลูกจึงได้ viewport จริง สัดส่วนไม่เพี้ยน
   มีสไลด์ละตัวเดียวเพราะเด็คเรนเดอร์ทีละสไลด์ · โหลดไฟล์เดียวกับตอนกดเปิดหน้าจอจริง
   กดเปิดทีหลังจึงมาจากแคช ไม่ได้โหลดซ้ำจริง */
function mountShot(){
  const b=document.querySelector('.veil .vshot'); if(!b) return;
  const f=b.querySelector('iframe'); if(!f) return;
  const sc=b.clientWidth/FRAME_W;
  if(!(sc>0)) return;
  f.style.width=FRAME_W+'px';
  f.style.height=SHOT_H+'px';
  f.style.transform='scale('+sc.toFixed(4)+')';
  if(f.src.indexOf('about:blank')>=0) f.src=f.dataset.src;
}
function fit(){
  const sh=g('sheet'); if(!sh) return;
  const fs=document.body.classList.contains('fs'), pad=fs?0:40;
  sh.style.transform='scale(1)';
  const availW=g('stage').clientWidth-pad, availH=g('stage').clientHeight-pad;
  const natH=sh.offsetHeight;
  let sc=Math.min(1,availW/1600);
  if(zoom==='page'||fs) sc=Math.min(availW/1600, availH/natH);
  sh.style.transform='scale('+sc+')';
  sh.style.marginBottom=(natH*(sc-1))+'px';
}
g('full').onclick=()=>{
  if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
  else document.exitFullscreen();
};
document.addEventListener('fullscreenchange',()=>{
  document.body.classList.toggle('fs',!!document.fullscreenElement);
  fit();
});
function go(i){cur=Math.max(0,Math.min(SLIDES.length-1,i));render();}

g('prev').onclick=()=>go(cur-1);
g('next').onclick=()=>go(cur+1);
g('navlist').onclick=e=>{const a=e.target.closest('a'); if(a){e.preventDefault();go(+a.dataset.i);closeNav();}};
document.querySelectorAll('#zoom button').forEach(b=>b.onclick=()=>{
  zoom=b.dataset.m;
  document.querySelectorAll('#zoom button').forEach(x=>x.classList.toggle('on',x===b));
  fit();});

const nv=g('nv'), scrim=document.querySelector('.scrim');
function openNav(){nv.classList.add('on');scrim.classList.add('on');}
function closeNav(){nv.classList.remove('on');scrim.classList.remove('on');}
g('menu').onclick=()=>nv.classList.contains('on')?closeNav():openNav();
document.querySelector('.edge').onmouseenter=openNav;
scrim.onclick=closeNav;
g('pin').onclick=()=>{document.body.classList.toggle('pinned');
  g('pin').classList.toggle('on',document.body.classList.contains('pinned'));
  try{localStorage.setItem('apexPresPin',document.body.classList.contains('pinned')?'1':'0');}catch(e){}
  closeNav();fit();};
try{if(localStorage.getItem('apexPresPin')==='1'){document.body.classList.add('pinned');g('pin').classList.add('on');}}catch(e){}

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(cur+1);}
  else if(e.key==='ArrowLeft') go(cur-1);
  else if(e.key==='ArrowDown'){if(scrollDemo(420)) e.preventDefault();}   /* เลื่อนหน้าจอเดโมลงล่าง */
  else if(e.key==='ArrowUp'){if(scrollDemo(-420)) e.preventDefault();}
  else if(e.key==='Home') go(0);
  else if(e.key==='End') go(SLIDES.length-1);
  /* Esc — เมนูเปิดอยู่ปิดเมนูก่อน ถ้าไม่มีเมนูก็ถอยจากหน้าจอจริงกลับแผงคำอธิบาย */
  else if(e.key==='Escape'){ if(nv.classList.contains('on')) closeNav(); else unlive(); }
  else if(e.key==='m'||e.key==='M') g('menu').click();
  else if(e.key==='p'||e.key==='P') g('pin').click();
  else if(e.key==='l'||e.key==='L') setLang(plang==='en'?'th':'en');
  else if(e.key==='f'||e.key==='F') g('full').click();
  else if(e.key===']') stepZoom(-40);      /* จอในสไลด์ใหญ่ขึ้น */
  else if(e.key==='[') stepZoom(40);       /* เห็นเนื้อหากว้างขึ้น */
  else if(e.key==='1'){zoom='width';document.querySelectorAll('#zoom button').forEach(x=>x.classList.toggle('on',x.dataset.m==='width'));fit();}
  else if(e.key==='2'){zoom='page';document.querySelectorAll('#zoom button').forEach(x=>x.classList.toggle('on',x.dataset.m==='page'));fit();}
});
window.addEventListener('resize',fit);
buildNav();
const h=location.hash.replace('#','');
const hi=SLIDES.findIndex(s=>s.k===h);
go(hi>=0?hi:0);
/* เปิดครั้งแรกแบบแคชว่าง ฟอนต์ยังมาไม่ถึงตอน render แรก ความสูงแผงจึงยังไม่นิ่ง
   พอฟอนต์พร้อมค่อยวัดกรอบใหม่อีกรอบ */
try{document.fonts.ready.then(()=>{mountShot();fit();});}catch(e){}
</script>
