<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="apex-logo.png" />
<meta name="robots" content="noindex, nofollow" />

<title>แผนผังความสัมพันธ์เอกสาร — APEX Circuit</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --hdr:#4f9de6; --strip:#bfdff6; --bg:#eef4fb;
  --blue:#1f6fc4; --green:#1e9e50; --amber:#d9a400; --red:#d93838; --purple:#7a4fd3;
  --orange:#c25f1e; --cyan:#0e8ca8; --teal:#12857a;
  --ink:#2b3a4a; --mut:#7d8ea0;
  --p-blue:#f1f8fe; --p-green:#f4fbf7; --p-red:#fdf4f4; --p-amber:#fdfaef; --p-purple:#f8f4fd; --p-cyan:#f0fafd;
  --line:#edf2f8; --line-d:#d7e2ee; --edge:#c3d5e8;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:"Sarabun","Segoe UI",Tahoma,"Thonburi",sans-serif;background:var(--bg);
     color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
#app{height:100vh;display:flex;flex-direction:column}

/* ─── แถบบน ─── */
.top{background:#fff;border-bottom:1px solid var(--line-d);display:flex;align-items:center;
     gap:18px;padding:11px 18px;flex:none;box-shadow:0 1px 3px rgba(31,80,140,.05);z-index:40}
.brand{display:flex;align-items:center;gap:12px;flex:none}
.brand .bi{width:40px;height:40px;border-radius:11px;background:#fff;border:1px solid var(--line-d);
  display:flex;align-items:center;justify-content:center;color:var(--hdr)}
.brand .bi svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.apexlogo{width:30px;height:30px;object-fit:contain}
.brand h1{font-size:19px;font-weight:700;color:var(--blue);line-height:1.2}
.brand .m{font-size:11.5px;color:var(--mut);margin-top:1px}
.finder{display:flex;align-items:stretch;border:1.5px solid var(--line-d);border-radius:10px;
        overflow:hidden;background:#fff;flex:none;transition:.15s}
.finder:focus-within{border-color:#7FB3E0;box-shadow:0 0 0 3px rgba(127,179,224,.16)}
.finder select{border:none;border-right:1px solid var(--line-d);background:#f7fafd;padding:0 30px 0 13px;
  font-family:inherit;font-size:13px;font-weight:600;color:#3a5773;outline:none;cursor:pointer;appearance:none;
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3E%3Cpath d='M1 1l5 5 5-5' stroke='%237d8ea0' stroke-width='1.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 10px center;background-size:10px}
.finder input{border:none;outline:none;padding:9px 13px;font-family:inherit;font-size:13.5px;
  width:250px;font-variant-numeric:tabular-nums;color:var(--ink)}
.finder button{border:none;background:var(--hdr);color:#fff;font-family:inherit;font-size:13px;font-weight:600;
  padding:0 17px;cursor:pointer;display:flex;align-items:center;gap:7px;transition:.15s}
.finder button:hover{background:#3d8ad6}
.finder button svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round}
.tools{margin-left:auto;display:flex;align-items:center;gap:5px;flex:none}
.tb{width:36px;height:36px;border-radius:10px;border:1px solid transparent;background:transparent;
    color:#5b7590;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.tb:hover{background:var(--p-blue);color:var(--blue)}
.tb.on{background:var(--p-blue);color:var(--blue);border-color:#bcdcf7}
.tb svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tsep{width:1px;height:22px;background:var(--line-d);margin:0 6px}

/* ─── พื้นที่กราฟ ─── */
.stage{flex:1;position:relative;overflow:hidden;
  background:
    radial-gradient(circle at 1px 1px, #d3e0ee 1px, transparent 0) 0 0/26px 26px,
    linear-gradient(#f4f8fc,#eef4fb)}
.stage.grab{cursor:grab} .stage.grabbing{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#nodes{position:absolute;left:0;top:0}

/* ─── การ์ดเอกสาร ─── */
.n{position:absolute;width:230px;background:#fff;border-radius:13px;border:1px solid #e1eaf4;
   box-shadow:0 2px 5px rgba(31,80,140,.07),0 10px 24px -14px rgba(31,80,140,.35);
   overflow:hidden;cursor:pointer;transition:box-shadow .18s,transform .18s,opacity .18s}
.n:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(31,80,140,.11),0 16px 30px -14px rgba(31,80,140,.45)}
.n.sel{border-color:var(--hdr);box-shadow:0 0 0 3px rgba(79,157,230,.28),0 14px 30px -12px rgba(31,80,140,.5)}
.n.dim{opacity:.26;filter:saturate(.35)}
.n .nh{height:33px;display:flex;align-items:center;gap:7px;padding:0 11px;color:#fff}
.n .nh svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.n .nh span{font-size:11.5px;font-weight:600;letter-spacing:.2px}
.n .nh .ext{margin-left:auto;width:21px;height:21px;border-radius:6px;background:rgba(255,255,255,.22);
  display:flex;align-items:center;justify-content:center;transition:.15s}
.n .nh .ext:hover{background:rgba(255,255,255,.4)}
.n .nb{padding:10px 12px 11px}
.n .cd{font-size:15px;font-weight:700;color:var(--ink);letter-spacing:.1px;font-variant-numeric:tabular-nums}
.n .tt{font-size:11.5px;color:var(--mut);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n .st{display:inline-block;margin-top:7px;padding:2px 9px;border-radius:11px;font-size:10px;font-weight:700}
.n .kv{display:flex;justify-content:space-between;gap:9px;font-size:11.5px;margin-top:5px}
.n .kv .k{color:var(--mut);flex:none}
.n .kv .v{font-weight:600;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-variant-numeric:tabular-nums}
.h-so{background:linear-gradient(100deg,#1e9e50,#28b562)}
.h-fc{background:linear-gradient(100deg,#7a4fd3,#9067e0)}
.h-mps{background:linear-gradient(100deg,#0e8ca8,#17a3c2)}
.h-wo{background:linear-gradient(100deg,#1f6fc4,#3f8ad9)}
.h-pln{background:linear-gradient(100deg,#5b7590,#728da8)}
.h-pr{background:linear-gradient(100deg,#c99400,#e0ab14)}
.h-po{background:linear-gradient(100deg,#c25f1e,#dd7530)}
.h-gr{background:linear-gradient(100deg,#12857a,#199e91)}
.h-in{background:linear-gradient(100deg,#3d4f63,#54687e)}
.s-ok{background:var(--p-green);color:#1a7a42}
.s-run{background:var(--p-blue);color:var(--blue)}
.s-wait{background:var(--p-amber);color:#8a6a00}
.s-plan{background:#eef2f6;color:#5a6b7d}
.s-fc{background:var(--p-purple);color:#54339c}

/* ─── เส้นเชื่อม ─── */
.e{fill:none;stroke:var(--edge);stroke-width:2;transition:stroke .18s,opacity .18s,stroke-width .18s}
.e.act{stroke:var(--hdr);stroke-width:2.6}
.e.dim{opacity:.18}
.eflow{fill:none;stroke:#fff;stroke-width:2.6;stroke-dasharray:5 9;opacity:0}
.eflow.act{opacity:.85;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-14}}
.elab{font-size:10.5px;fill:#7d8ea0;font-family:inherit;text-anchor:middle;
  paint-order:stroke;stroke:#f2f7fc;stroke-width:5px;stroke-linejoin:round}
.elab.act{fill:var(--blue);font-weight:600}
.elab.dim{opacity:.2}

/* ─── ชิปกรองมุมซ้ายบน ─── */
.deps{position:absolute;left:16px;top:14px;display:flex;gap:7px;z-index:20;flex-wrap:wrap;max-width:520px}
.dep{border:1.5px solid var(--line-d);background:rgba(255,255,255,.94);backdrop-filter:blur(4px);
  border-radius:20px;padding:5px 13px 5px 9px;font-family:inherit;font-size:12px;font-weight:600;
  color:#4a6b86;cursor:pointer;display:flex;align-items:center;gap:7px;transition:.15s}
.dep:hover{border-color:#9dbdd9}
.dep .dt{width:9px;height:9px;border-radius:3px;flex:none}
.dep.off{opacity:.42}
.dep.off .dt{background:#c3d0dd!important}

/* ─── แผงรายละเอียด ─── */
.panel{position:absolute;right:16px;top:14px;bottom:14px;width:376px;background:#fff;border-radius:14px;
  box-shadow:0 8px 34px -10px rgba(15,40,80,.28),0 2px 8px rgba(31,80,140,.08);
  display:flex;flex-direction:column;overflow:hidden;z-index:30;
  transform:translateX(0);transition:transform .22s ease,opacity .22s}
.panel.hide{transform:translateX(calc(100% + 22px));opacity:0;pointer-events:none}
.ph{padding:13px 16px;color:#fff;display:flex;align-items:flex-start;gap:10px}
.ph .pt{font-size:11.5px;font-weight:600;opacity:.92;letter-spacing:.2px}
.ph .pc{font-size:17px;font-weight:700;line-height:1.25;font-variant-numeric:tabular-nums}
.ph .px{margin-left:auto;width:26px;height:26px;border-radius:8px;border:none;background:rgba(255,255,255,.22);
  color:#fff;font-size:17px;cursor:pointer;font-family:inherit;line-height:1;flex:none;transition:.15s}
.ph .px:hover{background:rgba(255,255,255,.38)}
.pb{flex:1;overflow:auto;padding:14px 16px}
.pb::-webkit-scrollbar{width:7px}
.pb::-webkit-scrollbar-thumb{background:#dbe6f1;border-radius:4px}
.prow{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;padding:7px 0;border-bottom:1px solid var(--line)}
.prow:last-of-type{border-bottom:none}
.prow .k{color:var(--mut);flex:none}
.prow .v{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.pchip{display:inline-block;padding:3px 11px;border-radius:12px;font-size:11px;font-weight:700}
.plink{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line-d);border-radius:9px;
  background:#fff;padding:6px 13px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--blue);
  cursor:pointer;margin-top:11px;transition:.15s}
.plink:hover{border-color:#9dbdd9;background:var(--p-blue)}
.plink svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.psec{font-size:12px;font-weight:700;color:#3a5773;margin:16px 0 9px;display:flex;align-items:center;gap:8px}
.psec .n{font-weight:400;color:var(--mut)}
.psec::before{content:'';width:3px;height:13px;border-radius:2px;background:var(--hdr)}
.li{border:1px solid var(--line-d);border-radius:10px;padding:10px 12px;margin-bottom:8px;transition:.15s}
.li:hover{border-color:#9dbdd9;background:#fbfdff}
.li .r1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.li .cd{font-size:13px;font-weight:700;color:var(--ink)}
.li .q{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.li .nmx{font-size:11.5px;color:var(--mut);margin-top:1px;line-height:1.4}
.li .r2{display:flex;justify-content:flex-end;font-size:11px;margin-top:5px;font-variant-numeric:tabular-nums}
.li .trk{height:5px;background:#eef3f8;border-radius:3px;overflow:hidden;margin-top:6px}
.li .trk i{display:block;height:100%;border-radius:3px}
.ptot{display:flex;justify-content:space-between;align-items:baseline;border-top:1.5px solid var(--line-d);
  margin-top:12px;padding-top:11px;font-size:13px}
.ptot .v{font-size:20px;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums}
.pnav{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.pnav .col{border:1px solid var(--line-d);border-radius:10px;padding:9px 11px}
.pnav .col .h{font-size:11px;color:var(--mut);margin-bottom:6px}
.pnav .col button{display:block;width:100%;text-align:left;border:none;background:transparent;font-family:inherit;
  font-size:12px;font-weight:600;color:var(--blue);padding:3px 0;cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pnav .col button:hover{text-decoration:underline}
.pnav .col .none{font-size:12px;color:#c3d0dd}

/* ─── ควบคุมมุมล่าง ─── */
.zoom{position:absolute;left:16px;bottom:16px;display:flex;align-items:center;gap:3px;
  background:rgba(255,255,255,.95);backdrop-filter:blur(6px);border:1px solid var(--line-d);
  border-radius:12px;padding:5px 7px;box-shadow:0 3px 12px -4px rgba(31,80,140,.25);z-index:20}
.zb{width:29px;height:29px;border-radius:8px;border:none;background:transparent;color:#5b7590;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-family:inherit;font-size:16px;transition:.15s}
.zb:hover{background:var(--p-blue);color:var(--blue)}
.zb svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.zv{min-width:52px;text-align:center;font-size:12.5px;font-weight:700;color:#3a5773;font-variant-numeric:tabular-nums}
.zsep{width:1px;height:18px;background:var(--line-d);margin:0 4px}
.legend{position:absolute;right:16px;bottom:16px;display:flex;gap:14px;flex-wrap:wrap;justify-content:flex-end;
  background:rgba(255,255,255,.95);backdrop-filter:blur(6px);border:1px solid var(--line-d);
  border-radius:12px;padding:9px 14px;box-shadow:0 3px 12px -4px rgba(31,80,140,.25);z-index:20;max-width:420px}
.legend.push{right:406px}
.lg{display:flex;align-items:center;gap:7px;font-size:11.5px;color:#4a6b86}
.lg i{width:11px;height:11px;border-radius:4px;flex:none}
.hintbar{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(43,58,74,.9);
  color:#fff;font-size:12px;padding:7px 15px;border-radius:20px;z-index:20;white-space:nowrap;
  box-shadow:0 4px 14px -4px rgba(15,40,80,.4)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:82px;z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center}
.tst{background:#0f3f8c;color:#fff;border-radius:10px;padding:10px 18px;font-size:13px;
     box-shadow:0 8px 22px -6px rgba(15,40,80,.45);animation:pop .2s ease-out}
.tst.warn{background:#a06a00}
@keyframes pop{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}

/* ══ เก็บรายละเอียดความสวยงามทั้งโปรแกรม ══ */
::selection{background:#cfe6fa;color:#1a3a5c}
:focus-visible{outline:2px solid #7FB3E0;outline-offset:2px;border-radius:6px}
button,select,input,textarea{font-family:inherit}
button{-webkit-tap-highlight-color:transparent}
*::-webkit-scrollbar{width:9px;height:9px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:#d6e2ee;border-radius:6px;border:2px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:#bcd0e2;background-clip:content-box}
/* ปุ่มและช่องกรอกให้สูงเท่ากันและมุมนุ่มขึ้น */
.btn{border-radius:20px;transition:border-color .15s,box-shadow .15s,background .15s,color .15s}
.btn:active{transform:translateY(.5px)}
.sel,.inp{border-radius:8px;border-color:#dfe7f0;transition:border-color .15s,box-shadow .15s}
.sel:hover,.inp:hover{border-color:#c2d5e8}
.chip{letter-spacing:.1px}
/* ตัวเลขทุกที่ใช้ความกว้างเท่ากัน อ่านเป็นคอลัมน์ได้ */
td,th,input[type=number]{font-variant-numeric:tabular-nums}

/* ── ซ่อนหัวและท้ายอัตโนมัติเมื่อถูกเปิดในหน้ารวม ── */
html.embed header,html.embed footer,html.embed .topstrip{display:none!important}
html.embed #app{min-height:100vh}
html.embed .content{padding-top:14px}
</style>
</head>

/* ══════════ วางตำแหน่ง ══════════ */
const NW=230, NH=150, CGAP=86, RGAP=26;
function layout(){
  const cols={}; NODES.forEach(n=>(cols[n.col]=cols[n.col]||[]).push(n));
  const maxR=Math.max(...Object.values(cols).map(a=>a.length));
  const H=maxR*NH+(maxR-1)*RGAP;
  Object.entries(cols).forEach(([c,arr])=>{
    arr.sort((a,b)=>a.row-b.row);
    const h=arr.length*NH+(arr.length-1)*RGAP, off=(H-h)/2;
    arr.forEach((n,i)=>{ n.x=48+ +c*(NW+CGAP); n.y=48+off+i*(NH+RGAP); });
  });
  W_W=48*2+(Math.max(...NODES.map(n=>n.col))+1)*(NW+CGAP)-CGAP;
  W_H=96+H;
}
let W_W=0,W_H=0; layout();

/* ══════════ วาด ══════════ */
let SEL=null, FLOW=true, LAB=false, OFFDEP=new Set();
function related(id){
  const up=new Set(), dn=new Set();
  const walk=(x,dir,acc)=>EDGES.forEach(([a,b])=>{
    if(dir<0&&b===x&&!acc.has(a)){acc.add(a);walk(a,dir,acc);}
    if(dir>0&&a===x&&!acc.has(b)){acc.add(b);walk(b,dir,acc);}});
  walk(id,-1,up); walk(id,1,dn);
  return {up,dn,all:new Set([id,...up,...dn])};
}
function draw(){
  const act = (SEL&&FLOW)?related(SEL).all:null;
  const on = n=>!OFFDEP.has(TYPE[n.t][3]);
  g('nodes').innerHTML=NODES.map(n=>{
    const T=TYPE[n.t];
    const dim = (!on(n)) || (act&&!act.has(n.id));
    return `<div class="n ${n.id===SEL?'sel':''} ${dim?'dim':''}" style="left:${n.x}px;top:${n.y}px"
        data-id="${n.id}" onclick="pick('${n.id}')">
      <div class="nh ${T[1]}">${ICO[n.t]}<span>${T[0]}</span>
        <span class="ext" title="เปิดเอกสาร" onclick="event.stopPropagation();toast('เปิดเอกสาร ${n.code}')">
          <svg viewBox="0 0 24 24" style="width:12px;height:12px"><path d="M14 4h6v6"/><path d="M20 4l-8.5 8.5"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></span></div>
      <div class="nb">
        <div class="cd">${n.code}</div>
        <div class="tt" title="${n.title}">${n.title}</div>
        <div class="st ${n.stc}">${n.st}</div>
        ${n.kv.map(([k,v])=>`<div class="kv"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('')}
      </div></div>`;}).join('');

  const sv=g('edges'); sv.setAttribute('width',W_W); sv.setAttribute('height',W_H);
  sv.innerHTML=`<defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7.2" refY="3.2" orient="auto">
      <path d="M0 0 L7 3.2 L0 6.4 z" fill="var(--edge)"/></marker>
    <marker id="ara" markerWidth="9" markerHeight="9" refX="7.2" refY="3.2" orient="auto">
      <path d="M0 0 L7 3.2 L0 6.4 z" fill="#4f9de6"/></marker>
  </defs>`+
  EDGES.map(([a,b,lb])=>{
    const A=IDX[a],B=IDX[b];
    const x1=A.x+NW, y1=A.y+NH/2, x2=B.x-9, y2=B.y+NH/2;
    const mx=(x1+x2)/2;
    const d=`M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}`;
    const isAct = act && act.has(a) && act.has(b);
    const isDim = (OFFDEP.has(TYPE[A.t][3])||OFFDEP.has(TYPE[B.t][3])) || (act&&!isAct);
    const cls=`e ${isAct?'act':''} ${isDim?'dim':''}`;
    const lx=mx, ly=(y1+y2)/2-9;
    return `<path class="${cls}" d="${d}" marker-end="url(#${isAct?'ara':'ar'})"/>
      ${isAct?`<path class="eflow act" d="${d}"/>`:''}
      ${LAB?`<text class="elab ${isAct?'act':''} ${isDim?'dim':''}" x="${lx}" y="${ly}">${lb}</text>`:''}`;
  }).join('');

  const vis=NODES.filter(on).length;
  g('brandMeta').textContent=`${vis} เอกสาร · ${EDGES.filter(([a,b])=>on(IDX[a])&&on(IDX[b])).length} เส้นเชื่อม`

    <div class="prow"><span class="k">ชื่อรายการ</span><span class="v">${n.title}</span></div>
    ${n.kv.map(([k,v])=>`<div class="prow"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('')}
    ${calc}
    ${items?`<div class="psec">รายการสินค้า <span class="n">(${n.items.length})</span></div>${items}`:''}
    ${n.amount?`<div class="ptot"><span>มูลค่ารวม</span><span class="v">${nf(n.amount)}</span></div>`:''}
    <div class="psec">เชื่อมต่อกับเอกสาร</div>
    <div class="pnav">
      <div class="col"><div class="h">ต้นทาง (${par.length})</div>
        ${par.length?par.map(x=>`<button onclick="pick('${x}')">← ${IDX[x].code}</button>`).join(''):'<div class="none">ไม่มี</div>'}</div>
      <div class="col"><div class="h">ปลายทาง (${chi.length})</div>
        ${chi.length?chi.map(x=>`<button onclick="pick('${x}')">${IDX[x].code} →</button>`).join(''):'<div class="none">ไม่มี</div>'}</div>
    </div>
    <div class="psec">ทั้งสายที่เกี่ยวข้อง</div>
    <div class="prow"><span class="k">เอกสารต้นทางทั้งหมด</span><span class="v">${R.up.size} ฉบับ</span></div>
    <div class="prow"><span class="k">เอกสารปลายทางทั้งหมด</span><span class="v">${R.dn.size} ฉบับ</span></div>
    <div class="prow"><span class="k">รวมทั้งสาย</span><span class="v">${R.all.size} ฉบับ</span></div>`;
  g('panel').classList.remove('hide');
  g('legend').classList.add('push');
}
function closePanel(){SEL=null;g('panel').classList.add('hide');g('legend').classList.remove('push');draw();}

/* ══════════ ซูม / เลื่อน ══════════ */
let Z=0.7,TX=0,TY=0;
function apply(){g('world').style.transform=`translate(${TX}px,${TY}px) scale(${Z})`;
  g('zv').textContent=Math.round(Z*100)+'%';}
function zoomBy(d){const c=g('stage').getBoundingClientRect();
  const cx=c.width/2,cy=c.height/2, nz=Math.min(2,Math.max(0.25,Z+d));
  TX=cx-(cx-TX)*(nz/Z); TY=cy-(cy-TY)*(nz/Z); Z=nz; apply();}
function fit(){
  const c=g('stage').getBoundingClientRect();
  const pad=36, pr=g('panel').classList.contains('hide')?0:400;
  const availW=Math.max(200,c.width-pr-pad*2), availH=Math.max(200,c.height-pad*2-56);
  Z=Math.max(0.25,Math.min(availW/W_W, availH/W_H, 1.5));
  TX=Math.max(20,(c.width-pr-W_W*Z)/2);
  TY=Math.max(14,(c.height-W_H*Z)/2-14);
  apply();
}
function reset(){fit();}
const st=g('stage');
let drag=null;
st.addEventListener('mousedown',e=>{
  if(e.target.closest('.n,.panel,.zoom,.legend,.deps'))return;
  drag={x:e.clientX-TX,y:e.clientY-TY}; st.classList.add('grabbing');});
window.addEventListener('mousemove',e=>{if(!drag)return;TX=e.clientX-drag.x;TY=e.clientY-drag.y;apply();});
window.addEventListener('mouseup',()=>{drag=null;st.classList.remove('grabbing');});
st.addEventListener('wheel',e=>{
  if(!e.ctrlKey&&!e.metaKey)return; e.preventDefault();
  const r=st.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
  const nz=Math.min(2,Math.max(0.25,Z*(e.deltaY<0?1.1:0.9)));
  TX=mx-(mx-TX)*(nz/Z); TY=my-(my-TY)*(nz/Z); Z=nz; apply();},{passive:false});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel();});

function relayout(){layout();draw();fit();toast('จัดวางแผนผังใหม่แล้ว');}
function doSearch(){
  const code=g('dCode').value.trim().toUpperCase();
  const n=NODES.find(x=>x.code.toUpperCase()===code);
  if(!n) return toast(`ไม่พบเอกสาร ${code} ในแผนผังนี้`,'warn');
  pick(n.id); centerOn(n.id);
}
function centerOn(id){const n=IDX[id], c=g('stage').getBoundingClientRect();
  const pr=g('panel').classList.contains('hide')?0:400;
  TX=(c.width-pr)/2-(n.x+NW/2)*Z; TY=c.height/2-(n.y+NH/2)*Z; apply();}
function toast(m,c=''){const d=document.createElement('div');d.className='tst '+c;d.textContent=m;
  g('toast').appendChild(d);setTimeout(()=>d.remove(),3000);}

renderDeps(); renderLegend(); draw(); apply();
setTimeout(()=>{fit();},0);
setTimeout(()=>{const h=g('hintbar'); if(h) h.style.display='none';},9000);
</script>
